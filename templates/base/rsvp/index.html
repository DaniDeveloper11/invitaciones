<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <!-- Página privada del evento: que no aparezca en buscadores. -->
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Confirmaciones · __TITULO__</title>
  </head>
  <body data-pagina="rsvp" class="bg-paper text-ink font-sans antialiased">
    <!--
      Panel de los festejados del RSVP con pases (se abre con #admin=<token>).
      La lógica vive en @invitaciones/core (componente rsvpAdmin) y los datos en
      la API. Sólo se publica con `rsvp.modo: 'pases'` en src/event.config.js.
      Edita este HTML libremente para cambiar el diseño.
    -->
    <main x-data="rsvpAdmin" class="mx-auto max-w-3xl px-5 pb-24 pt-[max(2.5rem,env(safe-area-inset-top))]">
      <header class="mb-10 text-center">
        <p class="uppercase tracking-[0.25em] text-xs text-ink/50">Confirmaciones</p>
        <h1 class="mt-3 font-serif text-4xl" x-text="$store.event.hero.titulo || $store.event.titulo"></h1>
        <p x-show="estado === 'listo'" class="mt-2 text-xs text-ink/50" x-text="textoCierre"></p>
      </header>

      <p x-show="estado === 'cargando'" class="text-center text-sm text-ink/50">Cargando…</p>
      <p x-show="estado === 'deshabilitado'" x-cloak class="text-center text-ink/70">
        Esta invitación no confirma la asistencia con pases.
      </p>
      <p x-show="estado === 'sin_acceso'" x-cloak class="text-center text-ink/70">
        Este enlace de festejados no es válido. Revisa que lo hayas copiado completo.
      </p>
      <div x-show="estado === 'error'" x-cloak class="text-center">
        <p class="text-sm text-ink/70" x-text="error"></p>
        <button type="button" @click="cargar()" class="mt-6 border border-ink/40 px-5 py-2.5 text-xs uppercase tracking-[0.2em]">
          Reintentar
        </button>
      </div>

      <template x-if="estado === 'listo'">
        <div>
          <!-- Totales -->
          <section class="grid grid-cols-2 gap-3 sm:grid-cols-4">
            <div class="border border-ink/15 p-4 text-center">
              <p class="font-serif text-4xl" x-text="totales.adultos + totales.ninos"></p>
              <p class="mt-1 text-[11px] uppercase tracking-[0.15em] text-ink/60">Asisten</p>
              <p class="mt-1 text-xs text-ink/50" x-text="`${totales.adultos} adultos · ${totales.ninos} niños`"></p>
            </div>
            <div class="border border-ink/15 p-4 text-center">
              <p class="font-serif text-4xl" x-text="conteo.pendiente"></p>
              <p class="mt-1 text-[11px] uppercase tracking-[0.15em] text-ink/60">Pases sin responder</p>
              <p class="mt-1 text-xs text-ink/50" x-text="`de ${totales.pases} pases`"></p>
            </div>
            <div class="border border-ink/15 p-4 text-center">
              <p class="font-serif text-4xl" x-text="totales.no_asisten"></p>
              <p class="mt-1 text-[11px] uppercase tracking-[0.15em] text-ink/60">No asisten</p>
              <p class="mt-1 text-xs text-ink/50">personas</p>
            </div>
            <div class="border border-ink/15 p-4 text-center">
              <p class="font-serif text-4xl" x-text="totales.personas - totales.adultos - totales.ninos"></p>
              <p class="mt-1 text-[11px] uppercase tracking-[0.15em] text-ink/60">Sin ocupar</p>
              <p class="mt-1 text-xs text-ink/50" x-text="`de ${totales.personas} invitados`"></p>
            </div>
          </section>

          <!-- Filtros, búsqueda y descarga -->
          <div class="mt-8 flex flex-wrap gap-1 text-xs uppercase tracking-[0.15em]">
            <template x-for="[valor, texto] in filtros" :key="valor">
              <button
                type="button"
                @click="filtro = valor"
                class="border px-3 py-2 uppercase"
                :class="filtro === valor ? 'border-ink bg-ink text-paper' : 'border-ink/20 hover:border-ink/60'"
                x-text="texto"
              ></button>
            </template>
          </div>
          <div class="mt-3 flex gap-2">
            <input
              x-model="busqueda"
              type="search"
              placeholder="Buscar por nombre"
              class="min-w-0 flex-1 border border-ink/20 bg-transparent px-3 py-2 text-sm focus:border-ink/60 focus:outline-none"
            />
            <button
              type="button"
              @click="descargarCsv()"
              class="bg-ink px-4 text-xs uppercase tracking-[0.15em] text-paper"
            >
              Descargar CSV
            </button>
          </div>
          <button
            type="button"
            @click="abrirEditor()"
            class="mt-3 w-full border border-dashed border-ink/30 py-2.5 text-xs uppercase tracking-[0.15em] hover:border-ink/60"
          >
            + Agregar pase
          </button>
          <p x-show="error" class="mt-3 text-xs text-red-700" x-text="error"></p>

          <!-- Pases -->
          <ul class="mt-6 space-y-3">
            <template x-for="pase in lista" :key="pase.id">
              <li class="border border-ink/15 p-4">
                <div class="flex items-start justify-between gap-3">
                  <div>
                    <p class="font-serif text-xl" x-text="pase.nombre"></p>
                    <p class="mt-0.5 text-xs text-ink/60" x-text="resumenPase(pase)"></p>
                    <p x-show="pase.enviada_en" class="mt-0.5 text-xs text-ink/50">
                      <span x-text="textoEnviada(pase)"></span> ·
                      <button type="button" @click="marcarEnviada(pase, false)" class="underline hover:text-ink">
                        desmarcar
                      </button>
                    </p>
                  </div>
                  <span
                    class="shrink-0 px-2 py-1 text-[10px] uppercase tracking-[0.15em]"
                    :class="{
                      'bg-ink text-paper': estadoPase(pase) === 'van',
                      'bg-ink/10 text-ink/70': estadoPase(pase) === 'no_van',
                      'border border-ink/30 text-ink/60': estadoPase(pase) === 'pendiente',
                    }"
                    x-text="{ van: 'Confirmado', no_van: 'No van', pendiente: 'Pendiente' }[estadoPase(pase)]"
                  ></span>
                </div>

                <ul class="mt-3 space-y-1 text-sm">
                  <template x-for="persona in pase.personas" :key="persona.id">
                    <li class="flex items-center gap-2" :class="persona.asiste === false && 'text-ink/40 line-through'">
                      <span class="w-4 text-center" x-text="persona.asiste === null ? '·' : persona.asiste ? '✓' : '✗'"></span>
                      <span x-text="nombrePersona(persona)"></span>
                      <span x-show="persona.nino" class="text-[10px] uppercase tracking-[0.15em] text-ink/50">niño/a</span>
                      <span x-show="persona.libre" class="text-[10px] uppercase tracking-[0.15em] text-ink/50">acompañante</span>
                    </li>
                  </template>
                </ul>

                <p x-show="pase.mensaje" class="mt-3 border-l-2 border-ink/20 pl-3 text-sm italic text-ink/70" x-text="pase.mensaje"></p>

                <div class="mt-4 flex flex-wrap gap-2 text-[11px] uppercase tracking-[0.15em]">
                  <button
                    type="button"
                    @click="copiar(pase)"
                    class="border border-ink/20 px-3 py-1.5 uppercase hover:border-ink/60"
                    x-text="copiado === pase.id ? '¡Copiado!' : 'Copiar enlace'"
                  ></button>
                  <button
                    type="button"
                    @click="abrirEditor(pase)"
                    class="border border-ink/20 px-3 py-1.5 uppercase hover:border-ink/60"
                  >
                    Editar
                  </button>
                  <a
                    x-show="porEnviar(pase) && abierta"
                    :href="invitacion(pase)"
                    @click="marcarEnviada(pase, true)"
                    target="_blank"
                    rel="noopener"
                    class="bg-ink px-3 py-1.5 text-paper"
                  >
                    Enviar invitación
                  </a>
                  <a
                    x-show="pase.enviada_en && estadoPase(pase) === 'pendiente' && abierta"
                    :href="recordatorio(pase)"
                    target="_blank"
                    rel="noopener"
                    class="border border-ink/20 px-3 py-1.5 hover:border-ink/60"
                  >
                    Recordar por WhatsApp
                  </a>
                </div>
              </li>
            </template>
          </ul>
          <p x-show="!lista.length" class="mt-10 text-center text-sm text-ink/50">No hay pases con ese filtro.</p>

          <!-- Editor de un pase (nuevo o existente) -->
          <template x-if="editor">
            <div
              class="fixed inset-0 z-50 flex items-end justify-center bg-ink/40 sm:items-center sm:p-5"
              @click.self="cerrarEditor()"
              @keydown.escape.window="cerrarEditor()"
            >
              <form
                @submit.prevent="guardarPase()"
                class="max-h-[92dvh] w-full max-w-lg overflow-y-auto bg-paper p-5 pb-[max(1.25rem,env(safe-area-inset-bottom))]"
              >
                <div class="flex items-center justify-between">
                  <h2 class="font-serif text-2xl" x-text="editor.id ? 'Editar pase' : 'Nuevo pase'"></h2>
                  <button type="button" @click="cerrarEditor()" class="px-2 text-2xl leading-none text-ink/50" aria-label="Cerrar">
                    &times;
                  </button>
                </div>

                <label class="mt-5 block text-[11px] uppercase tracking-[0.15em] text-ink/60">
                  Nombre del pase
                  <input
                    x-model="editor.nombre"
                    type="text"
                    maxlength="80"
                    placeholder="Familia Pérez"
                    class="mt-1 w-full border border-ink/20 bg-transparent px-3 py-2 text-base normal-case tracking-normal text-ink focus:border-ink/60 focus:outline-none"
                  />
                </label>
                <p class="mt-1 text-xs text-ink/50">Así lo saluda el mensaje de WhatsApp: "¡Hola, Familia Pérez!"</p>

                <label class="mt-4 block text-[11px] uppercase tracking-[0.15em] text-ink/60">
                  WhatsApp (opcional)
                  <input
                    x-model="editor.telefono"
                    type="tel"
                    inputmode="tel"
                    placeholder="33 1234 5678"
                    class="mt-1 w-full border border-ink/20 bg-transparent px-3 py-2 text-base normal-case tracking-normal text-ink focus:border-ink/60 focus:outline-none"
                  />
                </label>
                <p class="mt-1 text-xs text-ink/50">10 dígitos si es de México; de otro país, con su lada (EE.UU.: 1 y 10 dígitos).</p>

                <p class="mt-5 text-[11px] uppercase tracking-[0.15em] text-ink/60">Personas en el pase</p>
                <ul class="mt-2 space-y-3">
                  <template x-for="(persona, i) in editor.personas" :key="persona.clave">
                    <li class="border border-ink/15 p-3">
                      <div class="flex gap-2">
                        <input
                          x-model="persona.nombre"
                          type="text"
                          maxlength="80"
                          :placeholder="persona.libre ? 'Lo escribe el invitado' : 'Nombre'"
                          :aria-label="`Nombre de la persona ${i + 1}`"
                          class="min-w-0 flex-1 border border-ink/20 bg-transparent px-3 py-2 text-base focus:border-ink/60 focus:outline-none"
                        />
                        <button
                          type="button"
                          x-show="editor.personas.length > 1"
                          @click="quitarPersona(i)"
                          class="px-2 text-xl text-ink/50 hover:text-ink"
                          :aria-label="`Quitar a la persona ${i + 1}`"
                        >
                          &times;
                        </button>
                      </div>
                      <div class="mt-2 flex gap-5 text-sm text-ink/70">
                        <label class="flex items-center gap-2"><input x-model="persona.nino" type="checkbox" class="accent-ink" /> Niño/a</label>
                        <label class="flex items-center gap-2"><input x-model="persona.libre" type="checkbox" class="accent-ink" /> Acompañante</label>
                      </div>
                    </li>
                  </template>
                </ul>
                <div class="mt-3 flex flex-wrap gap-2 text-[11px] uppercase tracking-[0.15em]">
                  <button type="button" @click="agregarPersona()" class="border border-ink/20 px-3 py-1.5 uppercase hover:border-ink/60">
                    + Persona
                  </button>
                  <button type="button" @click="agregarPersona(true)" class="border border-ink/20 px-3 py-1.5 uppercase hover:border-ink/60">
                    + Acompañante
                  </button>
                </div>
                <p class="mt-2 text-xs text-ink/50">Acompañante: un lugar libre cuyo nombre escribe el invitado al confirmar.</p>
                <p x-show="editor.respondido" class="mt-2 text-xs text-ink/50">
                  Este pase ya respondió: quien agregues quedará sin responder hasta que vuelvan a confirmar.
                </p>

                <p x-show="errorEditor" class="mt-4 text-sm text-red-700" x-text="errorEditor"></p>

                <div class="mt-6 flex gap-2">
                  <button
                    type="submit"
                    :disabled="guardando"
                    class="flex-1 bg-ink py-3 text-xs uppercase tracking-[0.2em] text-paper disabled:opacity-50"
                    x-text="guardando ? 'Guardando…' : editor.id ? 'Guardar cambios' : 'Agregar pase'"
                  ></button>
                  <button type="button" @click="cerrarEditor()" class="border border-ink/20 px-4 text-xs uppercase tracking-[0.2em]">
                    Cancelar
                  </button>
                </div>

                <div x-show="editor.id" class="mt-6 border-t border-ink/15 pt-4 text-center text-xs">
                  <button
                    type="button"
                    x-show="!confirmarBorrar"
                    @click="confirmarBorrar = true"
                    class="uppercase tracking-[0.15em] text-red-700"
                  >
                    Borrar pase
                  </button>
                  <div x-show="confirmarBorrar">
                    <p class="text-ink/70">Se borra el pase con su respuesta y su enlace deja de funcionar.</p>
                    <div class="mt-3 flex justify-center gap-2 uppercase tracking-[0.15em]">
                      <button type="button" @click="borrarPase()" :disabled="guardando" class="bg-red-700 px-3 py-1.5 uppercase text-paper">
                        Sí, borrar
                      </button>
                      <button type="button" @click="confirmarBorrar = false" class="border border-ink/20 px-3 py-1.5 uppercase">
                        No
                      </button>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </template>
        </div>
      </template>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
