<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <!-- Página privada del evento: que no aparezca en buscadores. -->
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Fotos · __TITULO__</title>
  </head>
  <body data-pagina="fotos" class="bg-paper text-ink font-sans antialiased">
    <!--
      Fotos de invitados. La lógica vive en @invitaciones/core:
        camara          botones de cámara y galería (emite `fotos-elegidas`)
        fotosInvitados  código del QR, subida con progreso y muro en vivo
        fotosAdmin      panel de los festejados (se abre con #admin=<token>)
      Los textos salen de `fotosInvitados` en src/event.config.js.
      Edita este HTML libremente para cambiar el diseño.
    -->
    <div id="app" x-data class="min-h-screen">
      <!-- ═══════════════════════ Invitados ═══════════════════════ -->
      <template x-if="!$store.esAdmin">
        <main
          x-data="fotosInvitados"
          @fotos-elegidas.window="recibir($event.detail)"
          class="mx-auto max-w-3xl px-5 pb-24 pt-[max(2.5rem,env(safe-area-inset-top))]"
        >
          <header class="text-center mb-10">
            <a :href="$store.event.fotosInvitados.inicio" class="text-xs uppercase tracking-[0.2em] text-ink/50 hover:text-ink">
              ← Volver a la invitación
            </a>
            <p class="mt-8 uppercase tracking-[0.25em] text-xs text-ink/50" x-text="$store.event.fotosInvitados.eyebrow"></p>
            <h1 class="mt-3 font-serif text-4xl sm:text-5xl" x-text="$store.event.fotosInvitados.titulo"></h1>
            <p class="mt-2 font-serif italic text-lg text-ink/70" x-text="$store.event.hero.titulo"></p>
          </header>

          <!-- Cargando -->
          <p x-show="estado === 'cargando'" class="text-center text-sm text-ink/50">Cargando…</p>

          <!-- Evento sin álbum (fotosInvitados.habilitado = false) -->
          <p x-show="estado === 'deshabilitado'" x-cloak class="text-center text-ink/70">
            Esta invitación no tiene álbum de fotos.
          </p>

          <!-- Sin código: hay que escanear el QR (o escribir el código) -->
          <section x-show="estado === 'sin_codigo'" x-cloak class="mx-auto max-w-sm text-center">
            <p class="text-ink/80 leading-relaxed">
              Escanea el código QR del evento para compartir y ver las fotos.
            </p>
            <form @submit.prevent="usarCodigo()" class="mt-8 flex gap-2">
              <input
                x-model="codigoManual"
                placeholder="O escribe el código"
                autocapitalize="characters"
                autocomplete="off"
                class="min-w-0 flex-1 border border-ink/25 bg-transparent px-4 py-3 text-center uppercase tracking-[0.3em] placeholder:normal-case placeholder:tracking-normal focus:border-ink focus:outline-none"
              />
              <button type="submit" class="border border-ink bg-ink px-5 text-xs uppercase tracking-[0.2em] text-paper">
                Entrar
              </button>
            </form>
            <p x-show="error" class="mt-4 text-sm text-red-700" x-text="error"></p>
          </section>

          <!-- Error de conexión -->
          <section x-show="estado === 'error'" x-cloak class="text-center">
            <p class="text-sm text-ink/70" x-text="error"></p>
            <button
              type="button"
              @click="conectar()"
              class="mt-6 border border-ink/40 px-5 py-2.5 text-xs uppercase tracking-[0.2em] hover:bg-ink hover:text-paper"
            >
              Reintentar
            </button>
          </section>

          <template x-if="estado === 'listo'">
            <div>
              <!-- Subir -->
              <section class="mx-auto max-w-sm text-center">
                <p x-show="subidaAbierta" class="text-sm leading-relaxed text-ink/70" x-text="$store.event.fotosInvitados.nota"></p>
                <p x-show="!subidaAbierta" class="text-sm leading-relaxed text-ink/70" x-text="avisoSubida"></p>

                <template x-if="subidaAbierta">
                  <div class="mt-8">
                    <input
                      x-model="autor"
                      @change="guardarAutor()"
                      maxlength="60"
                      placeholder="Tu nombre (opcional)"
                      class="w-full border-b border-ink/25 bg-transparent px-1 py-2 text-center focus:border-ink focus:outline-none"
                    />
                    <div x-data="camara" class="mt-6 grid grid-cols-2 gap-3">
                      <button
                        type="button"
                        @click="tomar()"
                        class="flex flex-col items-center gap-2 bg-ink px-4 py-5 text-paper transition-opacity hover:opacity-90"
                      >
                        <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                          <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.3l1.4-2h7.6l1.4 2h2.3A1.5 1.5 0 0 1 21 8.5v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z" stroke-linejoin="round" />
                          <circle cx="12" cy="13" r="3.6" />
                        </svg>
                        <span class="text-xs uppercase tracking-[0.2em]">Tomar foto</span>
                      </button>
                      <button
                        type="button"
                        @click="elegir()"
                        class="flex flex-col items-center gap-2 border border-ink/40 px-4 py-5 transition-colors hover:border-ink"
                      >
                        <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                          <rect x="3" y="4" width="18" height="16" rx="1.5" />
                          <circle cx="9" cy="9.5" r="1.6" />
                          <path d="M21 16l-5-5-8 8" stroke-linejoin="round" />
                        </svg>
                        <span class="text-xs uppercase tracking-[0.2em]">Elegir fotos</span>
                      </button>
                    </div>
                  </div>
                </template>
              </section>

              <!-- Cola de subida -->
              <ul x-show="cola.length" class="mx-auto mt-8 max-w-sm space-y-2">
                <template x-for="item in cola" :key="item.clave">
                  <li class="flex items-center gap-3 border border-ink/15 p-2">
                    <div class="h-12 w-12 shrink-0 overflow-hidden bg-ink/5">
                      <img x-show="item.preview" :src="item.preview" alt="" class="h-full w-full object-cover" />
                    </div>
                    <div class="min-w-0 flex-1">
                      <p
                        class="truncate text-xs"
                        :class="item.estado === 'error' ? 'text-red-700' : 'text-ink/70'"
                        x-text="{
                          pendiente: 'En espera…',
                          preparando: 'Preparando…',
                          subiendo: 'Subiendo…',
                          esperando: item.error,
                          lista: '✓ Subida',
                          error: item.error,
                        }[item.estado]"
                      ></p>
                      <div class="mt-1.5 h-1 bg-ink/10">
                        <div class="h-full bg-ink transition-all" :style="`width: ${Math.round(item.progreso * 100)}%`"></div>
                      </div>
                    </div>
                    <template x-if="item.estado === 'error'">
                      <div class="flex shrink-0 gap-1 text-xs">
                        <button type="button" @click="reintentar(item)" class="px-2 py-1 underline">Reintentar</button>
                        <button type="button" @click="quitar(item)" class="px-2 py-1 text-ink/50" aria-label="Quitar">&times;</button>
                      </div>
                    </template>
                  </li>
                </template>
              </ul>

              <!-- Muro -->
              <section class="mt-14">
                <p
                  class="mb-4 text-center text-xs uppercase tracking-[0.2em] text-ink/50"
                  x-text="fotos.length ? `${evento.total} ${evento.total === 1 ? 'foto' : 'fotos'}` : ''"
                ></p>
                <p x-show="!fotos.length" class="text-center text-sm text-ink/50">
                  Aún no hay fotos. ¡Comparte la primera!
                </p>

                <div class="grid grid-cols-3 gap-1 sm:gap-2">
                  <template x-for="(foto, i) in fotos" :key="foto.id">
                    <button type="button" @click="show(i)" class="relative aspect-square overflow-hidden bg-ink/5">
                      <img :src="thumb(foto)" :alt="foto.autor ? `Foto de ${foto.autor}` : 'Foto'" loading="lazy" decoding="async" class="h-full w-full object-cover" />
                    </button>
                  </template>
                </div>

                <div x-show="siguiente" class="mt-8 text-center">
                  <button
                    type="button"
                    @click="masFotos()"
                    :disabled="cargandoMas"
                    class="border border-ink/40 px-5 py-2.5 text-xs uppercase tracking-[0.2em] hover:bg-ink hover:text-paper disabled:opacity-50"
                    x-text="cargandoMas ? 'Cargando…' : 'Ver más fotos'"
                  ></button>
                </div>
              </section>

              <!-- Visor a pantalla completa -->
              <div
                x-show="open"
                x-cloak
                @keydown.escape.window="close()"
                @keydown.arrow-right.window="next()"
                @keydown.arrow-left.window="prev()"
                x-transition.opacity
                class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-ink/95 p-4"
                @click.self="close()"
              >
                <button type="button" @click="close()" class="absolute top-[max(1.25rem,env(safe-area-inset-top))] right-5 text-3xl leading-none text-paper/70 hover:text-paper" aria-label="Cerrar">&times;</button>
                <button type="button" @click="prev()" class="absolute left-2 px-2 text-4xl text-paper/60 hover:text-paper sm:left-6" aria-label="Anterior">&#8249;</button>
                <img :src="photos[index]" alt="" :key="index" class="max-h-[80svh] max-w-full object-contain" />
                <p class="mt-4 text-sm text-paper/70" x-text="fotos[index]?.autor ? `📷 ${fotos[index].autor}` : ''"></p>
                <button type="button" @click="next()" class="absolute right-2 px-2 text-4xl text-paper/60 hover:text-paper sm:right-6" aria-label="Siguiente">&#8250;</button>
              </div>
            </div>
          </template>
        </main>
      </template>

      <!-- ═══════════════════════ Festejados ═══════════════════════ -->
      <template x-if="$store.esAdmin">
        <main x-data="fotosAdmin" class="mx-auto max-w-5xl px-5 pb-24 pt-[max(2.5rem,env(safe-area-inset-top))]">
          <header class="mb-10 text-center">
            <p class="uppercase tracking-[0.25em] text-xs text-ink/50">Panel de festejados</p>
            <h1 class="mt-3 font-serif text-4xl" x-text="evento?.nombre || $store.event.hero.titulo"></h1>
            <p class="mt-2 text-xs text-ink/50" x-text="textoVentana"></p>
          </header>

          <p x-show="estado === 'cargando'" class="text-center text-sm text-ink/50">Cargando…</p>
          <p x-show="estado === 'deshabilitado'" x-cloak class="text-center text-ink/70">
            Esta invitación no tiene álbum de fotos.
          </p>
          <p x-show="estado === 'sin_acceso'" x-cloak class="text-center text-ink/70">
            Este enlace de festejados no es válido. Revisa que lo hayas copiado completo.
          </p>
          <p x-show="estado === 'error'" x-cloak class="text-center text-sm text-ink/70" x-text="error"></p>

          <template x-if="estado === 'listo'">
            <div>
              <!-- Enlace para invitados -->
              <section class="mx-auto max-w-xl border border-ink/15 p-4">
                <p class="text-xs uppercase tracking-[0.2em] text-ink/50">Enlace para invitados (el mismo del QR)</p>
                <div class="mt-2 flex gap-2">
                  <input :value="enlaceInvitados" readonly @focus="$el.select()" class="min-w-0 flex-1 bg-ink/5 px-3 py-2 text-sm" />
                  <button type="button" @click="copiarEnlace()" class="bg-ink px-4 text-xs uppercase tracking-[0.2em] text-paper" x-text="copiado ? '¡Copiado!' : 'Copiar'"></button>
                </div>
              </section>

              <!-- Resumen, filtros y descarga -->
              <div class="mt-8 flex flex-wrap items-center justify-between gap-4">
                <div class="flex gap-1 text-xs uppercase tracking-[0.15em]">
                  <template
                    x-for="[valor, texto] in [['todas', `Todas (${fotos.length})`], ['visibles', `Visibles (${visibles.length})`], ['ocultas', `Ocultas (${fotos.length - visibles.length})`]]"
                    :key="valor"
                  >
                    <button
                      type="button"
                      @click="filtro = valor"
                      class="border px-3 py-2"
                      :class="filtro === valor ? 'border-ink bg-ink text-paper' : 'border-ink/20 hover:border-ink/60'"
                      x-text="texto"
                    ></button>
                  </template>
                </div>
                <button
                  type="button"
                  @click="descargarZip()"
                  :disabled="zip.activo || !visibles.length"
                  class="border border-ink px-4 py-2 text-xs uppercase tracking-[0.2em] hover:bg-ink hover:text-paper disabled:opacity-50"
                  x-text="zip.activo ? `Preparando ZIP… ${zip.hechas}/${zip.total}` : 'Descargar visibles (ZIP)'"
                ></button>
              </div>

              <p x-show="!filtradas.length" class="mt-16 text-center text-sm text-ink/50">No hay fotos aquí todavía.</p>

              <!-- Fotos -->
              <div class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4">
                <template x-for="foto in filtradas" :key="foto.id">
                  <figure class="border border-ink/10">
                    <button type="button" @click="ver(foto)" class="relative block aspect-square w-full overflow-hidden bg-ink/5">
                      <img x-show="miniaturas[foto.id]" :src="miniaturas[foto.id]" alt="" class="h-full w-full object-cover transition-opacity" :class="foto.oculta && 'opacity-30'" />
                      <span x-show="foto.oculta" class="absolute inset-x-0 top-2 text-center text-[10px] uppercase tracking-[0.2em]">Oculta</span>
                    </button>
                    <figcaption class="flex items-center justify-between gap-2 p-2 text-xs">
                      <span class="min-w-0 truncate text-ink/70" x-text="`${foto.autor || 'Invitado'} · ${hora(foto)}`"></span>
                      <span class="flex shrink-0 gap-2">
                        <button type="button" @click="alternar(foto)" class="underline" x-text="foto.oculta ? 'Mostrar' : 'Ocultar'"></button>
                        <button type="button" @click="borrar(foto)" class="text-red-700 underline">Borrar</button>
                      </span>
                    </figcaption>
                  </figure>
                </template>
              </div>

              <!-- Visor -->
              <div
                x-show="visor"
                x-cloak
                x-transition.opacity
                @keydown.escape.window="visor = null"
                @click.self="visor = null"
                class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-ink/95 p-4"
              >
                <button type="button" @click="visor = null" class="absolute top-[max(1.25rem,env(safe-area-inset-top))] right-5 text-3xl leading-none text-paper/70 hover:text-paper" aria-label="Cerrar">&times;</button>
                <img :src="visor?.url" alt="" class="max-h-[80svh] max-w-full object-contain" />
                <p class="mt-4 text-sm text-paper/70" x-text="visor?.foto.autor ? `📷 ${visor.foto.autor}` : ''"></p>
              </div>
            </div>
          </template>
        </main>
      </template>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
