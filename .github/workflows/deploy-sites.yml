# Publica cada invitación en SU propio repositorio (rama gh-pages), para que
# cada una pueda servirse en su dominio propio:
#
#   sites/<slug>  →  github.com/<owner>/<slug>@gh-pages  →  https://<dominio>/
#
# El dominio de cada invitación sale de VITE_SITE_URL en sites/<slug>/.env.
# Necesita el secreto SITES_DEPLOY_TOKEN con permiso de escritura sobre los
# repos de las invitaciones (el GITHUB_TOKEN por defecto sólo alcanza a este).
name: Publica cada invitación en su repo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-sites
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Cada invitación es un submódulo: sin esto sites/ llega vacío.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/deploy-sites.mjs
        env:
          SITES_DEPLOY_TOKEN: ${{ secrets.SITES_DEPLOY_TOKEN }}
