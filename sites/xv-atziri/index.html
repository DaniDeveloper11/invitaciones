<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Te invito a celebrar conmigo mis XV años el 20 de febrero de 2027 en San Juanito de Escobedo, Jal. Abre tu invitación para ver los detalles y confirmar tu asistencia." />
    <meta name="theme-color" content="#fcf9f4" />

    <!--
      Vista previa al compartir (WhatsApp, Facebook, Telegram, iMessage…).
      La dirección sale de VITE_SITE_URL (archivo .env): absoluta, con https://
      y terminada en "/". Cámbiala ahí, no aquí.
      La imagen debe ser JPG o PNG de 1200x630 en public/images/og.jpg — WhatsApp
      descarta WebP y las imágenes pesadas (mantenla por debajo de 300 KB).
    -->
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:site_name" content="Mis XV Años · Atziri" />
    <meta property="og:title" content="Mis XV Años · Atziri" />
    <meta property="og:description" content="Te invito a celebrar conmigo mis XV años el 20 de febrero de 2027 en San Juanito de Escobedo, Jal. Abre tu invitación para ver los detalles y confirmar tu asistencia." />
    <meta property="og:image" content="%VITE_SITE_URL%images/og.jpg" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%images/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rosas menta y eucalipto con el texto: Mis XV Años, Atziri. Te invito a celebrar conmigo, 20 de febrero de 2027" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mis XV Años · Atziri" />
    <meta name="twitter:description" content="Te invito a celebrar conmigo mis XV años el 20 de febrero de 2027." />
    <meta name="twitter:image" content="%VITE_SITE_URL%images/og.jpg" />
    <meta name="twitter:image:alt" content="Mis XV Años, Atziri. 20 de febrero de 2027" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Sólo los íconos que se usan (en orden alfabético); agrega aquí los nuevos. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..400,0..1,0&icon_names=apparel,auto_awesome,calendar_today,celebration,church,close,face_retouching_natural,favorite,hourglass_top,mail,music_note,near_me,photo_camera,photo_library,pin_drop,redeem,restaurant,schedule,wine_bar&display=block"
      rel="stylesheet"
    />
    <title>Mis XV Atziri</title>
  </head>
  <body class="bg-paper text-ink font-sans text-sm antialiased">
    <!--
      Esta plantilla no contiene datos: todo sale de src/event.config.js y se lee
      con `$store.event`. Para cambiar textos, fotos o colores edita ese archivo.
      Para cambiar el diseño, edita este HTML libremente.
    -->
    <div id="app" x-data class="mx-auto flex min-h-screen w-full max-w-[480px] flex-col overflow-hidden pb-[env(safe-area-inset-bottom)]">
      <!--
        Apertura tipo sobre (public/images/sobre/). Cubre la invitación hasta
        que el invitado toca el sello: late, las dos mitades se abren como
        puertas llevándose media cera cada una, y la pantalla se desvanece.
        Las mitades se cortan por el centro del sello (x = 50.55%).
      -->
      <div
        x-data="sobre"
        x-show="!abierto"
        x-transition:leave="transition-opacity duration-700 ease-in"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 z-[60] flex flex-col items-center justify-center overflow-hidden bg-paper px-6"
      >
        <img src="/images/deco/esquina.webp" alt="" class="pointer-events-none absolute -left-6 -top-4 h-44 w-32 object-contain opacity-80" />
        <img src="/images/deco/peonias.webp" alt="" class="pointer-events-none absolute -bottom-6 -right-6 h-40 w-32 rotate-180 object-contain opacity-60" />

        <p class="relative z-10 mb-6 font-script text-[40px] leading-none text-menta transition-opacity duration-500" :class="abriendo && 'opacity-0'">
          Tienes una invitación
        </p>

        <button
          type="button"
          @click="abrir()"
          class="relative aspect-[548/967] max-w-[86vw] cursor-pointer [perspective:1400px]"
          style="height: min(64svh, 560px)"
          aria-label="Abrir la invitación"
        >
          <!-- Sombra del sobre (aparte: un filtro aplanaría el 3D de las puertas) -->
          <div class="absolute inset-[2%] rounded-sm shadow-2xl transition-opacity duration-700 delay-500" :class="abriendo && 'opacity-0'"></div>

          <!-- Tarjeta que aparece al abrir -->
          <div
            class="absolute inset-[5%] flex flex-col items-center justify-center rounded-lg border border-cuero/30 bg-card text-center shadow-inner transition duration-1000 delay-700 ease-out"
            :class="abriendo ? 'scale-100 opacity-100' : 'scale-90 opacity-0'"
          >
            <img src="/images/deco/guirnalda.webp" alt="" class="mb-2 h-14 w-40 object-contain" />
            <p class="font-display text-[11px] font-semibold uppercase tracking-[0.28em] text-cuero" x-text="$store.event.hero.eyebrow"></p>
            <p class="font-script text-6xl leading-[1.1] text-menta" x-text="$store.event.hero.titulo"></p>
          </div>

          <!-- Puertas: cada mitad gira sobre su borde exterior -->
          <img
            src="/images/sobre/izq.webp"
            alt=""
            class="absolute left-0 top-0 z-10 h-full w-[50.55%] origin-left transition duration-[1300ms] delay-[400ms] ease-[cubic-bezier(0.65,0,0.35,1)] [backface-visibility:hidden]"
            :class="abriendo && '[transform:rotateY(-115deg)]'"
          />
          <img
            src="/images/sobre/der.webp"
            alt=""
            class="absolute right-0 top-0 z-10 h-full w-[49.45%] origin-right transition duration-[1300ms] delay-[400ms] ease-[cubic-bezier(0.65,0,0.35,1)] [backface-visibility:hidden]"
            :class="abriendo && '[transform:rotateY(115deg)]'"
          />

          <!-- Sello entero encima del corte: late y, al abrir, da un último latido
               y se quita justo cuando las puertas se llevan sus dos mitades -->
          <img
            x-show="!selloRoto"
            src="/images/sobre/sello.webp"
            alt=""
            class="absolute left-[33.58%] top-[40.85%] z-20 w-[33.94%] drop-shadow-[0_3px_4px_rgba(60,20,10,0.35)]"
            :class="abriendo ? 'sello-romper' : 'sello-latido'"
          />
        </button>

        <p
          class="mt-6 animate-pulse text-xs font-semibold uppercase tracking-[0.3em] text-cafe transition-opacity duration-500"
          :class="abriendo && 'opacity-0'"
        >
          Toca el sello para abrir
        </p>
      </div>

      <!-- Música de fondo (public/audio/song.mp3) -->
      <template x-if="$store.event.tieneMusica">
        <div x-data="audioPlayer" class="fixed bottom-5 right-5 z-40">
          <audio
            id="musica"
            x-ref="audio"
            :src="src"
            loop
            preload="auto"
            @play="playing = true"
            @pause="playing = false"
          ></audio>
          <button
            type="button"
            @click="toggle()"
            class="flex h-12 w-12 items-center justify-center rounded-full border border-arena-oscura bg-card/90 text-menta shadow-md backdrop-blur transition-colors hover:border-menta"
            :aria-label="playing ? 'Pausar música' : 'Reproducir música'"
          >
            <svg
              class="h-5 w-5"
              :class="{ 'animate-[spin_4s_linear_infinite]': playing }"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
            >
              <circle cx="12" cy="12" r="9" />
              <circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none" />
              <line x1="12" y1="3" x2="12" y2="5" />
            </svg>
          </button>
        </div>
      </template>

      <!--
        Portada. Su entrada (clase .entrada, ver style.css) espera a que se abra
        el sobre (evento sobre-abierto); sin sobre, aparece al cargar.
      -->
      <section
        x-data="{ visible: false }"
        x-init="visible = !document.querySelector('[x-data=sobre]')"
        @sobre-abierto.window="visible = true"
        :class="visible && 'entrada-visible'"
        class="relative flex flex-col items-center px-5 pb-6 pt-[max(1.5rem,env(safe-area-inset-top))] text-center"
      >
        <img
          src="/images/deco/esquina.webp"
          alt=""
          class="pointer-events-none absolute -left-8 -top-6 z-0 h-44 w-32 object-contain opacity-80"
        />

        <img src="/images/deco/guirnalda.webp" alt="" class="entrada relative z-10 mb-2 h-16 w-48 object-contain opacity-90" />

        <div class="entrada relative z-10 mb-2 flex items-center gap-2" style="--retraso: 150ms">
          <span class="h-px w-6 bg-cuero/40"></span>
          <p class="font-display text-[11px] font-semibold uppercase tracking-[0.28em] text-cuero" x-text="$store.event.hero.eyebrow"></p>
          <span class="h-px w-6 bg-cuero/40"></span>
        </div>

        <div class="entrada entrada-desenfoque relative z-10 my-1" style="--retraso: 300ms">
          <h1 class="font-script text-[58px] leading-[1.1] text-menta drop-shadow-sm" x-text="$store.event.hero.titulo"></h1>
          <p
            x-show="$store.event.hero.subtitulo"
            class="-mt-1 font-display text-[11px] uppercase tracking-[0.25em] text-cafe"
            x-text="$store.event.hero.subtitulo"
          ></p>
        </div>

        <!--
          public/images/hero.webp — vertical, ~900x1200px. Ocupa todo el ancho y
          tiene parallax: la foto es 30% más alta que su marco y baja más lento
          que el scroll (se queda quieta con "reducir movimiento").
        -->
        <template x-if="$store.event.hero.imagen">
          <div
            data-hero
            x-data="{ h: 0, quieto: matchMedia('(prefers-reduced-motion: reduce)').matches }"
            x-init="h = $el.offsetHeight"
            @resize.window.debounce.150ms="h = $el.offsetHeight"
            class="entrada entrada-zoom relative z-10 -mx-5 mb-8 mt-4 aspect-[4/5] w-[calc(100%+2.5rem)]"
            style="--retraso: 500ms"
          >
            <div class="absolute inset-0 overflow-hidden">
              <img
                :src="$store.event.hero.imagen"
                :alt="$store.event.hero.titulo"
                fetchpriority="high"
                decoding="async"
                onerror="this.closest('[data-hero]').style.display='none'"
                class="absolute inset-x-0 -top-[15%] h-[130%] w-full object-cover will-change-transform"
                :style="quieto ? '' : `transform: translate3d(0, ${Math.min($store.scroll.y * 0.2, h * 0.15)}px, 0)`"
              />
              <!-- Funde los bordes con el fondo de la página -->
              <div class="absolute inset-x-0 top-0 h-16 bg-gradient-to-b from-paper to-transparent"></div>
              <div class="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-paper to-transparent"></div>
            </div>
            <div class="absolute -bottom-4 left-1/2 z-20 flex -translate-x-1/2 items-center gap-1.5 rounded-full border border-arena-oscura/40 bg-card/95 px-4 py-1 shadow">
              <span class="material-symbols-outlined text-xs text-cuero">auto_awesome</span>
              <span class="text-[11px] font-semibold uppercase tracking-wider text-cuero" x-text="`${$store.event.hero.titulo} · XV`"></span>
            </div>
          </div>
        </template>

        <div class="entrada relative z-10 mt-2 flex items-center gap-3 rounded-full bg-card/90 px-6 py-3 shadow-sm" style="--retraso: 800ms">
          <span class="material-symbols-outlined text-base text-menta">calendar_today</span>
          <p class="font-display text-[11px] font-semibold uppercase tracking-[0.18em] text-cuero" x-text="$store.event.fechaPortada"></p>
        </div>

        <p
          x-show="$store.event.mensaje.texto"
          class="entrada entrada-desenfoque relative z-10 mt-5 max-w-xs whitespace-pre-line px-4 font-serif text-lg italic leading-normal text-texto"
          style="--retraso: 1000ms"
          x-text="$store.event.mensaje.texto"
        ></p>
      </section>

      <img src="/images/deco/divisor-dorado.webp" alt="" class="mx-auto max-h-10 w-[calc(100%-3rem)] object-contain py-2 opacity-85" />

      <!-- Cuenta regresiva -->
      <section x-data="countdown" class="relative my-4 px-5">
        <div x-reveal.lg class="relative overflow-hidden rounded-xl bg-card p-4 text-center shadow-md">
          <span class="material-symbols-outlined pointer-events-none absolute -bottom-6 -right-6 text-8xl text-cuero opacity-5">celebration</span>
          <div class="mb-3 flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-sm text-cuero">hourglass_top</span>
            <h2 class="font-script text-[34px] leading-[1.1] text-cuero" x-text="$store.event.cuentaRegresiva.eyebrow"></h2>
          </div>

          <div x-show="!terminado" class="relative z-10 grid grid-cols-4 gap-2">
            <template
              x-for="[valor, etiqueta] in [[dias, 'Días'], [horas, 'Horas'], [minutos, 'Min'], [segundos, 'Seg']]"
              :key="etiqueta"
            >
              <div class="flex flex-col items-center rounded-lg bg-crema px-1 py-2.5 shadow-inner">
                <span class="font-serif text-[28px] font-semibold leading-8 text-menta tabular-nums" x-text="pad(valor)"></span>
                <span class="mt-0.5 text-[11px] font-semibold uppercase tracking-wider text-cafe" x-text="etiqueta"></span>
              </div>
            </template>
          </div>

          <p x-show="terminado" x-cloak class="font-serif text-2xl italic text-menta" x-text="$store.event.cuentaRegresiva.finalizado"></p>
        </div>
      </section>

      <!-- Padres y padrinos (familia.grupos en event.config.js) -->
      <template x-if="$store.event.familia?.grupos?.length">
        <section class="my-4 px-5">
          <div x-reveal.lg class="relative overflow-hidden rounded-xl bg-card p-6 text-center shadow-md">
            <img
              src="/images/deco/caballo.webp"
              alt=""
              class="pointer-events-none absolute left-1/2 top-1/2 w-44 -translate-x-1/2 -translate-y-1/2 opacity-10"
            />
            <div class="relative z-10 flex flex-col items-center">
              <template x-for="(grupo, i) in $store.event.familia.grupos" :key="grupo.titulo">
                <div class="flex flex-col items-center">
                  <div x-show="i > 0" class="my-4 flex w-32 items-center justify-center gap-3">
                    <span class="h-px w-full bg-arena-oscura"></span>
                    <span class="material-symbols-outlined text-xs text-menta">favorite</span>
                    <span class="h-px w-full bg-arena-oscura"></span>
                  </div>
                  <p class="mb-1 font-display text-[11px] font-semibold uppercase tracking-[0.22em] text-cafe" x-text="grupo.eyebrow"></p>
                  <h3 class="mb-1 font-script text-4xl leading-[1.1] text-cuero" x-text="grupo.titulo"></h3>
                  <p class="text-base font-medium text-ink">
                    <template x-for="(nombre, j) in grupo.nombres" :key="nombre">
                      <span class="block"><span x-show="j > 0" class="font-normal text-cuero/70">&amp; </span><span x-text="nombre"></span></span>
                    </template>
                  </p>
                </div>
              </template>
            </div>
          </div>
        </section>
      </template>

      <!-- Galería (galeria.fotos en event.config.js) -->
      <template x-if="$store.event.tieneGaleria">
        <section class="my-4 px-5">
          <div x-reveal.lg class="relative flex flex-col items-center overflow-hidden rounded-xl bg-card p-5 text-center shadow-md">
            <div class="mb-1 flex items-center justify-center gap-2">
              <span class="material-symbols-outlined text-base text-menta">photo_camera</span>
              <p class="font-display text-[11px] font-semibold uppercase tracking-[0.22em] text-cafe" x-text="$store.event.galeria.eyebrow"></p>
            </div>
            <h2 class="mb-4 font-script text-4xl leading-[1.1] text-cuero" x-text="$store.event.galeria.titulo"></h2>

            <!-- Carrusel con miniaturas; al tocar la foto grande se abre el visor -->
            <div x-data="gallery" class="w-full">
              <div x-data="carrusel" @pointerdown="detener()">
                <div class="relative overflow-hidden rounded-xl border border-arena/50 bg-crema shadow-sm">
                  <div
                    x-ref="pista"
                    @scroll.debounce.50ms="alDeslizar()"
                    class="flex aspect-[4/5] snap-x snap-mandatory overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
                  >
                    <template x-for="(photo, i) in photos" :key="i">
                      <button type="button" @click="show(i)" class="h-full w-full shrink-0 snap-center" :aria-label="`Ver foto ${i + 1}`">
                        <img
                          :src="photo"
                          :alt="`Foto ${i + 1} de ${$store.event.hero.titulo}`"
                          :loading="i === 0 ? 'eager' : 'lazy'"
                          decoding="async"
                          class="h-full w-full object-cover"
                        />
                      </button>
                    </template>
                  </div>

                  <!-- Flechas (útiles en computadora; en el celular se desliza) -->
                  <button
                    type="button"
                    x-show="photos.length > 1"
                    @click="detener(); ir(activo - 1)"
                    class="absolute left-2 top-1/2 z-10 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-card/85 pb-0.5 text-3xl leading-none text-cuero shadow-sm"
                    aria-label="Foto anterior"
                  >&#8249;</button>
                  <button
                    type="button"
                    x-show="photos.length > 1"
                    @click="detener(); ir(activo + 1)"
                    class="absolute right-2 top-1/2 z-10 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-card/85 pb-0.5 text-3xl leading-none text-cuero shadow-sm"
                    aria-label="Foto siguiente"
                  >&#8250;</button>

                  <span
                    class="absolute bottom-2 right-2 z-10 rounded-full bg-card/85 px-2.5 py-0.5 text-[11px] font-semibold tracking-wider text-cuero"
                    x-text="`${activo + 1} / ${photos.length}`"
                  ></span>
                </div>

                <!-- Miniaturas -->
                <div
                  x-show="photos.length > 1"
                  x-ref="tira"
                  class="mt-2.5 flex gap-2 overflow-x-auto px-0.5 py-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
                >
                  <template x-for="(photo, i) in photos" :key="i">
                    <button
                      type="button"
                      @click="detener(); ir(i)"
                      :class="activo === i ? 'ring-2 ring-menta opacity-100' : 'opacity-55 hover:opacity-90'"
                      class="aspect-[4/5] w-14 shrink-0 overflow-hidden rounded-lg transition"
                      :aria-label="`Ir a la foto ${i + 1}`"
                      :aria-current="activo === i"
                    >
                      <img :src="photo" alt="" loading="lazy" decoding="async" class="h-full w-full object-cover" />
                    </button>
                  </template>
                </div>
              </div>

              <!-- Visor a pantalla completa -->
              <div
                x-show="open"
                x-cloak
                @keydown.escape.window="close()"
                @keydown.arrow-right.window="next()"
                @keydown.arrow-left.window="prev()"
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0"
                x-transition:enter-end="opacity-100"
                x-transition:leave="transition ease-in duration-200"
                x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0"
                class="fixed inset-0 z-50 col-span-full flex items-center justify-center bg-ink/95 p-4"
                @click.self="close()"
              >
                <button
                  type="button"
                  @click="close()"
                  class="absolute right-5 top-[max(1.25rem,env(safe-area-inset-top))] text-3xl leading-none text-paper/70 hover:text-paper"
                  aria-label="Cerrar"
                >
                  &times;
                </button>
                <button type="button" @click="prev()" class="absolute left-2 px-2 text-4xl text-paper/60 hover:text-paper" aria-label="Anterior">
                  &#8249;
                </button>
                <img
                  :src="photos[index]"
                  :alt="`Foto ${index + 1}`"
                  x-transition:enter="transition ease-out duration-300"
                  x-transition:enter-start="opacity-0 scale-95"
                  x-transition:enter-end="opacity-100 scale-100"
                  :key="index"
                  class="max-h-[85svh] max-w-full rounded-lg object-contain"
                />
                <button type="button" @click="next()" class="absolute right-2 px-2 text-4xl text-paper/60 hover:text-paper" aria-label="Siguiente">
                  &#8250;
                </button>
              </div>
            </div>

            <p x-show="$store.event.galeria.nota" class="mt-3 text-xs italic text-texto" x-text="$store.event.galeria.nota"></p>
          </div>
        </section>
      </template>

      <!-- Misa y recepción (ceremonias en event.config.js) -->
      <template x-for="(c, i) in $store.event.ceremonias || []" :key="c.titulo">
        <div>
          <section class="my-4 px-5">
            <div x-reveal.lg class="relative flex flex-col items-center overflow-hidden rounded-xl bg-card p-6 text-center shadow-md">
              <img
                x-show="i % 2 === 0"
                src="/images/deco/ramo.webp"
                alt=""
                class="pointer-events-none absolute -right-4 -top-4 h-20 w-20 object-contain opacity-40"
              />
              <img
                x-show="i % 2 === 1"
                src="/images/deco/peonias.webp"
                alt=""
                class="pointer-events-none absolute -bottom-6 -left-6 h-24 w-24 object-contain opacity-35"
              />
              <div
                :class="i % 2 === 0 ? 'bg-menta-suave/40 text-menta' : 'bg-arena text-cuero'"
                class="mb-3 flex h-12 w-12 items-center justify-center rounded-full shadow-sm"
              >
                <span class="material-symbols-outlined text-2xl" x-text="c.icono"></span>
              </div>
              <span class="font-display text-[11px] font-semibold uppercase tracking-[0.22em] text-cafe" x-text="c.eyebrow"></span>
              <h2 class="mb-2 mt-0.5 font-script text-[40px] leading-[1.1] text-cuero" x-text="c.titulo"></h2>

              <div class="my-2 flex items-center gap-2 rounded-full bg-crema px-5 py-1.5">
                <span class="material-symbols-outlined text-sm text-menta">schedule</span>

              <p class="mb-5 mt-0.5 max-w-xs text-xs text-texto" x-text="c.direccion"></p>

              <a
                x-show="c.mapsUrl"

                :class="i % 2 === 0 ? 'bg-cuero hover:bg-cuero/95' : 'bg-menta hover:bg-menta/95'"
                class="flex w-full max-w-xs items-center justify-center gap-2 rounded-full px-6 py-3 text-[13px] font-semibold uppercase tracking-wider text-white shadow transition-colors active:scale-[0.98]"
              >
                <span class="material-symbols-outlined text-base" x-text="i % 2 === 0 ? 'near_me' : 'pin_drop'"></span>
                <span x-text="c.boton || 'Ver ubicación'"></span>
              </a>
            </div>
          </section>

            x-show="i === 0 && $store.event.ceremonias.length > 1"
            x-reveal.scale
            src="/images/deco/guitarra.webp"
            alt=""
            class="mx-auto my-3 h-48 w-48 object-contain drop-shadow-sm"
          />
        </div>
      </template>

      <!-- Itinerario (itinerario en event.config.js; vacío lo oculta) -->
      <template x-if="$store.event.itinerario?.length">
        <section class="my-4 px-5">
          <div x-reveal.lg class="rounded-xl bg-card px-5 py-6 shadow-md">
            <div class="text-center">
              <span class="font-display text-[11px] font-semibold uppercase tracking-[0.22em] text-cafe">Mi gran día</span>
              <h2 class="mb-5 mt-0.5 font-script text-[40px] leading-[1.1] text-cuero">Itinerario</h2>
            </div>

            <ol class="relative">
              <!-- Línea vertical que une los íconos -->
              <span class="absolute bottom-6 left-6 top-6 w-px -translate-x-1/2 bg-arena-oscura"></span>
              <template x-for="(paso, i) in $store.event.itinerario" :key="paso.hora + paso.titulo">
                <li x-reveal :style="`transition-delay: ${i * 80}ms`" class="relative flex gap-4 py-2.5">
                  <span
                    :class="i === 0 ? 'bg-menta text-white shadow-md' : 'border border-cuero/40 bg-card text-cuero'"
                    class="relative z-10 flex h-12 w-12 shrink-0 items-center justify-center rounded-full"
                  >
                    <span class="material-symbols-outlined text-[22px]" x-text="paso.icono"></span>
                  </span>
                  <div
                    :class="i === 0 && 'rounded-lg bg-menta-suave/25 px-3 py-2 -my-1'"
                    class="min-w-0 flex-1 self-center"
                  >
                    <p class="font-display text-[11px] font-semibold uppercase tracking-[0.18em] text-cafe" x-text="paso.hora"></p>
                    <p
                      :class="i === 0 ? 'font-script text-[30px] leading-[1.15] text-menta' : 'font-serif text-xl font-semibold leading-tight text-ink'"
                      x-text="paso.titulo"
                    ></p>
                    <p x-show="paso.nota" class="mt-0.5 font-serif text-[15px] italic leading-snug text-texto" x-text="paso.nota"></p>
                  </div>
                </li>
              </template>
            </ol>
          </div>
        </section>
      </template>

      <img src="/images/deco/divisor-flor.webp" alt="" class="mx-auto max-h-10 w-[calc(100%-3rem)] object-contain py-2 opacity-80" />

      <!-- Dress code: prendas por grupo, colores prohibidos y visor de ejemplos -->
      <template x-if="$store.event.tieneDresscode">
        <section x-data="dresscode" class="my-4 px-5">
          <div x-reveal.lg class="relative overflow-hidden rounded-xl border border-arena-oscura/50 bg-card px-4 py-7 text-center shadow-md">
            <!-- Marco fino interior, como en la tarjeta impresa -->
            <div class="pointer-events-none absolute inset-2 rounded-lg border border-cuero/20"></div>

            <p class="font-serif text-2xl font-semibold italic text-cuero" x-text="eyebrow"></p>
            <h3 class="mt-1 font-display text-[28px] font-semibold uppercase leading-tight tracking-[0.04em] text-ink" x-text="titulo"></h3>
            <div x-show="subtitulo" class="mt-2 flex items-center justify-center gap-2">
              <span class="h-px w-6 bg-cuero/40"></span>
              <p class="font-display text-[11px] font-semibold uppercase tracking-[0.22em] text-cafe" x-text="subtitulo"></p>
              <span class="h-px w-6 bg-cuero/40"></span>
            </div>

            <!-- Prendas a los lados de la ilustración: grupos[0] izquierda, grupos[1] derecha -->
            <div x-show="grupos?.length" class="relative mt-5 grid grid-cols-[1fr_8.5rem_1fr] items-start gap-1">
              <img
                src="/images/deco/dresscode-pareja.webp"
                alt="Ejemplo de vestimenta vaquera formal para ellos y ellas"
                loading="lazy"
                decoding="async"
                class="order-2 w-full self-center drop-shadow-md"
              />
              <template x-for="(grupo, g) in (grupos || []).slice(0, 2)" :key="grupo.titulo">
                <div :class="g === 0 ? 'order-1' : 'order-3'">
                  <p class="mb-1 font-script text-[30px] leading-none text-menta" x-text="grupo.titulo"></p>
                  <ul>
                    <template x-for="(prenda, i) in grupo.prendas" :key="prenda.texto">
                      <li class="flex flex-col items-center gap-1 py-2.5" :class="i > 0 && 'border-t border-arena-oscura/50'">
                        <span class="flex h-10 w-10 items-center justify-center rounded-full border border-cuero/40 text-cuero">
                          <span class="block h-[22px] w-[22px]" x-html="$icono(prenda.icono)"></span>
                        </span>
                        <span class="font-serif text-sm leading-tight text-ink" x-text="prenda.texto"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
            </div>

            <!-- Colores prohibidos (tonos reservados para la quinceañera) -->
            <template x-if="prohibidos?.colores?.length">
              <div class="relative mt-6 rounded-lg bg-crema px-3 py-5">
                <div class="flex items-center justify-center gap-2">
                  <span class="h-px w-6 bg-cuero/40"></span>
                  <p class="font-display text-lg font-semibold uppercase tracking-[0.08em] text-[#8b1a1a]" x-text="prohibidos.titulo"></p>
                  <span class="h-px w-6 bg-cuero/40"></span>
                </div>
                <div class="mt-4 flex justify-center gap-8">
                  <template x-for="color in prohibidos.colores" :key="color.nombre">
                    <div class="flex flex-col items-center">
                      <span
                        class="relative h-16 w-16 overflow-hidden rounded-full border-[3px] border-[#a51c1c] shadow-sm"
                        :style="`background: linear-gradient(135deg, ${color.tonos.map((t, j) => `${t} ${(j * 100) / color.tonos.length}% ${((j + 1) * 100) / color.tonos.length}%`).join(', ')})`"
                      >
                        <span class="absolute left-1/2 top-1/2 h-[3px] w-[130%] -translate-x-1/2 -translate-y-1/2 -rotate-45 bg-[#a51c1c]"></span>
                      </span>
                      <p class="mt-2 font-display text-xs font-semibold uppercase tracking-[0.12em] text-ink" x-text="color.nombre"></p>
                      <p class="font-serif text-[13px] italic text-texto">Exclusivo de la quinceañera</p>
                    </div>
                  </template>
                </div>
                <p x-show="prohibidos.nota" class="mx-auto mt-4 max-w-xs font-serif text-[15px] italic leading-snug text-texto" x-text="prohibidos.nota"></p>
              </div>
            </template>

            <button
              type="button"
              x-show="photos.length"
              @click="show(0)"
              class="relative mx-auto mt-6 flex w-full max-w-xs items-center justify-center gap-2 rounded-full bg-cuero px-6 py-3 text-[13px] font-semibold uppercase tracking-wider text-white shadow transition-colors hover:bg-cuero/95 active:scale-[0.98]"
            >
              <span class="material-symbols-outlined text-base">photo_library</span>
              <span x-text="boton || 'Ver ejemplos'"></span>
            </button>
          </div>

          <!-- Visor de ejemplos: flechas, deslizar con el dedo, contador y miniaturas -->
          <div
            x-show="open"
            x-cloak
            x-data="{ x0: null }"
            @keydown.escape.window="open && close()"
            @keydown.arrow-right.window="open && next()"
            @keydown.arrow-left.window="open && prev()"
            @touchstart.passive="x0 = $event.touches[0].clientX"
            @touchend="if (x0 !== null) { const dx = $event.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) dx < 0 ? next() : prev(); x0 = null }"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            class="fixed inset-0 z-50 flex flex-col bg-ink/95 px-4 pb-[max(1rem,env(safe-area-inset-bottom))] pt-[max(1rem,env(safe-area-inset-top))]"
            role="dialog"
            aria-modal="true"
            :aria-label="eyebrow"
          >
            <div class="flex items-center justify-between text-paper/80">
              <span class="font-display text-xs font-semibold uppercase tracking-[0.2em]" x-text="`${index + 1} / ${photos.length}`"></span>
              <button type="button" @click="close()" class="px-2 text-3xl leading-none hover:text-paper" aria-label="Cerrar">&times;</button>
            </div>

            <div class="relative flex min-h-0 flex-1 items-center justify-center py-3" @click.self="close()">
              <button
                type="button"
                x-show="photos.length > 1"
                @click="prev()"
                class="absolute left-0 z-10 flex h-10 w-10 items-center justify-center rounded-full bg-ink/60 pb-0.5 text-3xl text-paper shadow hover:bg-ink/80"
                aria-label="Anterior"
              >&#8249;</button>
              <template x-for="(foto, i) in photos" :key="i">
                <img
                  x-show="index === i"
                  :src="foto"
                  :alt="`Ejemplo de vestimenta ${i + 1}`"
                  x-transition:enter="transition ease-out duration-300"
                  x-transition:enter-start="opacity-0 scale-95"
                  x-transition:enter-end="opacity-100 scale-100"
                  class="max-h-full max-w-full select-none rounded-lg object-contain"
                />
              </template>
              <button
                type="button"
                x-show="photos.length > 1"
                @click="next()"
                class="absolute right-0 z-10 flex h-10 w-10 items-center justify-center rounded-full bg-ink/60 pb-0.5 text-3xl text-paper shadow hover:bg-ink/80"
                aria-label="Siguiente"
              >&#8250;</button>
            </div>

            <div x-show="photos.length > 1" class="flex justify-center gap-2 overflow-x-auto py-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
              <template x-for="(foto, i) in photos" :key="i">
                <button
                  type="button"
                  @click="index = i"
                  :class="index === i ? 'ring-2 ring-menta-clara opacity-100' : 'opacity-50 hover:opacity-80'"
                  class="aspect-[4/5] w-12 shrink-0 overflow-hidden rounded-md transition"
                  :aria-label="`Ver ejemplo ${i + 1}`"
                  :aria-current="index === i"
                >
                  <img :src="foto" alt="" loading="lazy" class="h-full w-full object-cover" />
                </button>
              </template>
            </div>
          </div>
        </section>
      </template>

      <!-- Lluvia de sobres (regalos.texto vacío lo oculta) -->
      <template x-if="$store.event.regalos?.texto">
        <section class="my-4 px-5">
          <div x-reveal.lg class="flex flex-col items-center rounded-xl bg-card p-6 text-center shadow-md">
            <div class="mb-2 flex h-12 w-12 items-center justify-center rounded-full bg-arena/60 text-cuero">
              <span class="material-symbols-outlined text-2xl">mail</span>
            </div>
            <h3 class="mb-1 font-script text-[38px] leading-[1.1] text-cuero" x-text="$store.event.regalos.titulo"></h3>
            <p class="mb-3 max-w-xs leading-[22px] text-texto" x-text="$store.event.regalos.texto"></p>
            <div x-show="$store.event.regalos.cierre" class="flex items-center gap-2 rounded-full bg-crema px-4 py-2 text-cafe">
              <span class="material-symbols-outlined text-sm text-menta">redeem</span>
              <span class="text-[11px] font-semibold uppercase tracking-wider" x-text="$store.event.regalos.cierre"></span>
            </div>
          </div>
        </section>
      </template>

      <!-- Fotos de invitados: enlace a /fotos/ (fotosInvitados.habilitado) -->
      <template x-if="$store.event.tieneFotosInvitados">
        <section class="my-4 px-5">
          <div x-reveal.lg class="flex flex-col items-center rounded-xl bg-card p-6 text-center shadow-md">
            <div class="mb-2 flex h-12 w-12 items-center justify-center rounded-full bg-menta-suave/40 text-menta">
              <span class="material-symbols-outlined text-2xl">photo_camera</span>
            </div>
            <span class="font-display text-[11px] font-semibold uppercase tracking-[0.22em] text-cafe" x-text="$store.event.fotosInvitados.eyebrow"></span>
            <h3 class="mb-2 mt-0.5 font-script text-[38px] leading-[1.1] text-cuero" x-text="$store.event.fotosInvitados.titulo"></h3>
            <p class="mb-5 max-w-xs text-xs text-texto" x-text="$store.event.fotosInvitados.nota"></p>
            <a
              :href="$store.event.fotosInvitados.url"
              class="w-full max-w-xs rounded-full bg-menta px-6 py-3 text-[13px] font-semibold uppercase tracking-wider text-white shadow transition-colors hover:bg-menta/95"
              x-text="$store.event.fotosInvitados.boton"
            ></a>
          </div>
        </section>
      </template>

      <!-- RSVP: por WhatsApp (rsvp.modo: 'whatsapp') o con pases (rsvp.modo: 'pases') -->
      <template x-if="$store.event.tieneRsvp">
        <section id="rsvp" class="my-4 px-5">
          <div x-reveal.lg class="rounded-xl bg-card p-6 text-center shadow-md">
            <h2 class="font-script text-[40px] leading-[1.1] text-menta" x-text="$store.event.rsvp.titulo"></h2>
            <div class="mx-auto my-4 flex w-32 items-center justify-center gap-3">
              <span class="h-px w-full bg-arena-oscura"></span>
              <span class="material-symbols-outlined text-xs text-menta">favorite</span>
              <span class="h-px w-full bg-arena-oscura"></span>
            </div>

            <!-- Opciones de WhatsApp: modo 'whatsapp', o respaldo sin enlace personal -->
            <template x-if="!$store.event.tieneRsvpPases">
              <div x-data="rsvp">
                <p class="mx-auto mb-6 max-w-xs text-xs text-texto" x-text="nota"></p>
                <div class="grid grid-cols-2 gap-2.5 text-left">
                  <template x-for="opcion in opciones" :key="opcion">
                    <button
                      type="button"
                      @click="enviar(opcion)"
                      class="rounded-lg border border-arena-oscura bg-crema px-3 py-3 text-xs leading-snug text-ink transition-colors hover:border-menta hover:bg-menta hover:text-white"
                      x-text="opcion"
                    ></button>
                  </template>
                </div>
              </div>
            </template>

            <!-- Pases: cada invitado confirma con su enlace (/?i=<código>) -->
            <template x-if="$store.event.tieneRsvpPases">
              <div x-data="rsvpPases" class="text-left">
                <p x-show="estado === 'cargando'" class="text-center text-xs text-texto">Cargando tu invitación…</p>

                <div x-show="estado === 'sin_enlace'" class="text-center">
                  <p class="mx-auto max-w-xs text-xs text-texto" x-text="error || $store.event.rsvp.sinEnlace"></p>
                  <template x-if="$store.event.rsvp.conWhatsapp">
                    <div x-data="rsvp" class="mt-6 grid grid-cols-2 gap-2.5 text-left">
                      <template x-for="opcion in opciones" :key="opcion">
                        <button
                          type="button"
                          @click="enviar(opcion)"
                          class="rounded-lg border border-arena-oscura bg-crema px-3 py-3 text-xs leading-snug text-ink transition-colors hover:border-menta hover:bg-menta hover:text-white"
                          x-text="opcion"
                        ></button>
                      </template>
                    </div>
                  </template>
                </div>

                <div x-show="estado === 'error'" class="text-center">
                  <p class="mb-5 text-xs text-texto" x-text="error"></p>
                  <button
                    type="button"
                    @click="cargar()"
                    class="rounded-full border border-cuero/40 px-5 py-2.5 text-[11px] font-semibold uppercase tracking-[0.2em] text-cuero hover:bg-cuero hover:text-white"
                  >
                    Reintentar
                  </button>
                </div>

                <template x-if="estado === 'listo'">
                  <div>
                    <!-- Pase personal -->
                    <div class="flex flex-col items-center rounded-xl bg-arena/40 p-5 text-center shadow-inner">
                      <p class="mb-1 font-display text-[11px] font-semibold uppercase tracking-[0.22em] text-cuero">Pase Personal</p>
                      <p class="font-serif text-2xl font-semibold text-ink" x-text="pase.nombre"></p>
                      <div class="my-1 flex items-center justify-center gap-3">
                        <span class="font-serif text-[38px] font-bold leading-none text-cuero" x-text="personas.length"></span>
                        <div class="text-left">
                          <p class="font-serif text-[22px] font-semibold leading-tight text-ink" x-text="personas.length === 1 ? 'Lugar' : 'Lugares'"></p>
                          <p class="text-[11px] font-semibold uppercase tracking-wider text-cafe">Reservados en su honor</p>
                        </div>
                      </div>
                    </div>

                    <!-- Formulario -->
                    <form x-show="editando" @submit.prevent="enviar()" class="mt-6">
                      <p class="mb-5 text-center text-xs text-texto" x-text="$store.event.rsvp.nota"></p>
                      <ul class="space-y-2">
                        <template x-for="persona in personas" :key="persona.id">
                          <li class="rounded-lg border border-arena-oscura bg-crema px-4 py-3">
                            <label class="flex cursor-pointer items-center gap-3">
                              <input type="checkbox" x-model="persona.asiste" class="size-4 accent-menta" />
                              <span class="flex-1 text-sm text-ink" x-text="persona.libre ? 'Acompañante' : persona.nombre"></span>
                              <span x-show="persona.nino" class="text-[10px] uppercase tracking-[0.2em] text-cafe">Niño/a</span>
                            </label>
                            <input
                              x-show="persona.libre && persona.asiste"
                              x-model="persona.nombre"
                              @input="error = ''"
                              type="text"
                              maxlength="80"
                              placeholder="Nombre de tu acompañante"
                              class="mt-3 w-full border-b border-arena-oscura bg-transparent py-1.5 text-sm placeholder:text-cafe/60 focus:border-menta focus:outline-none"
                            />
                          </li>
                        </template>
                      </ul>

                      <textarea
                        x-model="mensaje"
                        rows="2"
                        maxlength="500"
                        placeholder="Mensaje para la quinceañera (opcional)"
                        class="mt-5 w-full rounded-lg border border-arena-oscura bg-crema px-4 py-3 text-sm placeholder:text-cafe/60 focus:border-menta focus:outline-none"
                      ></textarea>

                      <p x-show="error" class="mt-4 text-center text-sm text-red-700" x-text="error"></p>

                      <button
                        type="submit"
                        :disabled="enviando"
                        class="mt-5 w-full rounded-full bg-menta py-3.5 text-[13px] font-semibold uppercase tracking-wider text-white shadow disabled:opacity-60"
                        x-text="textoBoton"
                      ></button>
                      <button
                        x-show="personas.length > 1 && asistentes.length"
                        type="button"
                        @click="noAsistiremos()"
                        :disabled="enviando"
                        class="mt-3 w-full rounded-full border border-cuero/40 py-3 text-[11px] font-semibold uppercase tracking-[0.2em] text-cuero hover:bg-cuero/5"
                      >
                        No podremos asistir
                      </button>
                      <button
                        x-show="respondio"
                        type="button"
                        @click="cancelar()"
                        class="mt-3 w-full py-2 text-xs text-cafe underline underline-offset-4"
                      >
                        Cancelar
                      </button>
                      <p x-show="fechaLimite" class="mt-5 text-center text-xs italic text-texto">
                        Puedes confirmar o cambiar tu respuesta hasta el <span x-text="fechaLimite"></span>.
                      </p>
                    </form>

                    <!-- Respuesta guardada -->
                    <div x-show="!editando" class="mt-6 text-center">
                      <template x-if="respondio">
                        <div>
                          <p class="mb-3 font-display text-[11px] font-semibold uppercase tracking-[0.22em] text-menta" x-text="$store.event.rsvp.gracias"></p>
                          <p class="text-sm text-ink" x-text="resumen"></p>
                          <p x-show="mensaje" class="mt-4 font-serif text-base italic text-texto" x-text="`“${mensaje}”`"></p>
                        </div>
                      </template>
                      <p x-show="!respondio" class="text-xs text-texto">La fecha para confirmar ya pasó.</p>
                      <p x-show="error" class="mt-4 text-sm text-red-700" x-text="error"></p>
                      <template x-if="abierta">
                        <div>
                          <button
                            type="button"
                            @click="cambiar()"
                            class="mt-6 rounded-full border border-cuero/40 px-5 py-2.5 text-[11px] font-semibold uppercase tracking-[0.2em] text-cuero transition-colors hover:bg-cuero hover:text-white"
                          >
                            Cambiar respuesta
                          </button>
                          <p x-show="fechaLimite" class="mt-4 text-xs text-texto">Hasta el <span x-text="fechaLimite"></span>.</p>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </section>
      </template>

      <!-- Despedida -->
      <footer class="relative flex flex-col items-center px-5 pb-12 pt-6 text-center">
        <img src="/images/deco/guirnalda.webp" alt="" class="mb-2 h-20 w-32 object-contain opacity-80" />
        <h2 x-reveal.lg.blur class="mb-2 font-script text-[44px] leading-[1.1] text-menta" x-text="$store.event.footer"></h2>
        <p
          x-show="$store.event.despedida?.texto"
          x-reveal.delay-150
          class="mb-4 max-w-xs font-serif text-base italic text-cafe"
          x-text="$store.event.despedida?.texto"
        ></p>
        <div x-show="$store.event.despedida?.firma" x-reveal.delay-300 class="mt-2 flex items-center gap-2">
          <span class="h-px w-8 bg-cuero/30"></span>
          <p class="font-display text-[11px] font-semibold uppercase tracking-[0.25em] text-cuero" x-text="$store.event.despedida?.firma"></p>
          <span class="h-px w-8 bg-cuero/30"></span>
        </div>
