<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Ícono: la corona dorada (public/favicon-32.png, favicon.ico y apple-touch-icon.png) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Te invito a celebrar conmigo mis XV años. Abre tu invitación para ver la fecha, el lugar y confirmar tu asistencia." />
    <meta name="theme-color" content="#f7f3ee" />

    <!--
      Vista previa al compartir (WhatsApp, Facebook, Telegram, iMessage…).
      La dirección sale de VITE_SITE_URL (archivo .env): absoluta, con https://
      y terminada en "/". Cámbiala ahí, no aquí.
      La imagen debe ser JPG o PNG de 1200x630 en public/images/og.jpg — WhatsApp
      descarta WebP y las imágenes pesadas (mantenla por debajo de 300 KB).
    -->
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:site_name" content="Mis XV Años · Camila" />
    <meta property="og:title" content="Mis XV Años · Camila 👑" />
    <meta property="og:description" content="Te invito a celebrar conmigo mis XV años. Abre tu invitación para ver la fecha, el lugar y confirmar tu asistencia." />
    <meta property="og:image" content="%VITE_SITE_URL%images/og.jpg" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%images/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Corona dorada y bugambilias con el texto: Mis XV Años, Camila. Te invito a celebrar conmigo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mis XV Años · Camila 👑" />
    <meta name="twitter:description" content="Te invito a celebrar conmigo mis XV años." />
    <meta name="twitter:image" content="%VITE_SITE_URL%images/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
    <title>Mis XV Años · Camila</title>
  </head>
  <body class="bg-paper text-ink font-sans antialiased">
    <!--
      Esta plantilla no contiene datos: todo sale de src/event.config.js y se lee
      con `$store.event`. Para cambiar textos, fotos o colores edita ese archivo.
      Para cambiar el diseño, edita este HTML libremente.
    -->
    <div id="app" x-data class="relative mx-auto flex min-h-screen w-full max-w-[480px] flex-col overflow-x-clip md:shadow-2xl">
      <!--
        Apertura tipo sobre: tapa la invitación hasta que el invitado lo toca.
        La solapa se abre, la carta sube y la pantalla se desvanece.
      -->
      <div
        x-data="sobre"
        x-show="!abierto"
        x-transition:leave="transition-opacity duration-700 ease-in"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 z-[60] flex flex-col items-center justify-center overflow-hidden bg-paper bg-[url('/images/papel.svg')] px-6"
      >
        <div class="humo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

        <p
          class="mb-10 font-script text-4xl text-gold transition-opacity duration-500"
          :class="abriendo && 'opacity-0'"
        >Tienes una invitación</p>

        <button
          type="button"
          @click="abrir()"
          class="relative aspect-[10/7] w-[86vw] max-w-[360px] cursor-pointer [perspective:1200px]"
          aria-label="Abrir la invitación"
        >
          <!-- Fondo del sobre -->
          <div class="absolute inset-0 rounded-sm bg-[#e3c3bb] shadow-2xl"></div>

          <!-- Carta: sube al abrir -->
          <div
            class="absolute inset-x-[7%] top-[6%] bottom-[6%] z-10 flex flex-col items-center border border-gold/60 bg-paper pt-[6%] text-center shadow-md transition-transform delay-500 duration-1000 ease-out"
            :class="abriendo && '-translate-y-[58%]'"
          >
            <p class="whitespace-pre-line font-script text-3xl leading-[0.9] text-green" x-text="$store.event.hero.eyebrow"></p>
            <p class="mt-1 font-script text-4xl text-gold" x-text="$store.event.hero.titulo"></p>
          </div>

          <!-- Bolsillo delantero (deja ver la carta por arriba) -->
          <div
            class="absolute inset-0 z-20 rounded-sm bg-gradient-to-b from-[#f2e0da] to-[#ead0c8] [clip-path:polygon(0_0,50%_56%,100%_0,100%_100%,0_100%)]"
          ></div>
          <div class="absolute inset-0 z-20 [clip-path:polygon(0_100%,50%_52%,100%_100%)] bg-[#efd8d1]"></div>

          <!-- Solapa -->
          <div
            class="absolute inset-x-0 top-0 h-[58%] origin-top bg-gradient-to-b from-[#ecd2ca] to-[#e2bfb6] transition-transform duration-700 ease-in-out [clip-path:polygon(0_0,100%_0,50%_100%)]"
            :class="[abriendo ? '[transform:rotateX(180deg)]' : '', solapaAtras ? 'z-0' : 'z-30']"
          ></div>

          <!-- Sello de lacre (public/images/decoracion/sello.webp) con la inicial grabada -->
          <div
            class="absolute left-1/2 top-[58%] z-40 h-20 w-20 -translate-x-1/2 -translate-y-1/2 drop-shadow-[0_4px_6px_rgba(90,50,10,0.35)] transition duration-300"
            :class="abriendo && 'scale-50 opacity-0'"
          >
            <img src="/images/decoracion/sello.webp" alt="" aria-hidden="true" class="h-full w-full" />
            <span
              class="absolute inset-0 flex -translate-x-[6px] translate-y-[2px] items-center justify-center font-script text-[2.6rem] leading-none text-[#8a5a14] [text-shadow:0_1px_0_#f6dd9a,0_-1px_1px_#6b420c]"
              x-text="$store.event.hero.titulo.charAt(0)"
            ></span>
          </div>
        </button>

        <p
          class="mt-10 animate-pulse text-xs font-semibold uppercase tracking-[0.3em] text-ink/70 transition-opacity duration-500"
          :class="abriendo && 'opacity-0'"
        >Toca para abrir</p>
      </div>

      <!-- Humo rosa de fondo (estilos .humo en src/style.css) -->
      <div class="humo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

      <!-- Música de fondo (public/audio/song.mp3) -->
      <template x-if="$store.event.tieneMusica">
        <div x-data="audioPlayer" class="fixed bottom-5 right-5 z-40">
          <audio
            id="musica"
            x-ref="audio"
            :src="src"
            loop
            preload="auto"
            @play="playing = true"
            @pause="playing = false"
          ></audio>
          <button
            type="button"
            @click="toggle()"
            class="flex h-12 w-12 items-center justify-center rounded-full border border-ink/20 bg-paper/90 text-ink shadow-sm backdrop-blur transition-colors hover:border-ink/50"
            :aria-label="playing ? 'Pausar música' : 'Reproducir música'"
          >
            <svg
              class="h-5 w-5"
              :class="{ 'animate-[spin_4s_linear_infinite]': playing }"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
            >
              <circle cx="12" cy="12" r="9" />
              <circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none" />
              <line x1="12" y1="3" x2="12" y2="5" />
            </svg>
          </button>
        </div>
      </template>

      <!--
        Portada: arco de flores, "Mis XV Años", corona, nombre, foto en arco
        y la frase de mensaje.texto. Las flores decorativas están en public/images/decoracion/.
      -->
      <section
        x-data="{ show: false }"
        @sobre-abierto.window="setTimeout(() => (show = true), 100)"
        class="relative w-full overflow-hidden px-6 pb-16 text-center"
      >
        <!-- public/images/decoracion/arco.webp — arco de bugambilias que enmarca "Mis XV Años" -->
        <img
          src="/images/decoracion/arco.webp"
          alt=""
          aria-hidden="true"
          fetchpriority="high"
          onerror="this.remove()"
          class="pointer-events-none absolute inset-x-0 top-0 w-full transition-opacity duration-1000"
          :class="show ? 'opacity-100' : 'opacity-0'"
        />

        <div class="relative pt-[30vw] min-[480px]:pt-36">
          <h2
            x-show="show"
            x-transition:enter="transition ease-out duration-1000"
            x-transition:enter-start="opacity-0 translate-y-4"
            x-transition:enter-end="opacity-100 translate-y-0"
            class="whitespace-pre-line font-script text-6xl leading-[0.9] text-green"
            x-text="$store.event.hero.eyebrow"
          ></h2>

          <!-- Corona dorada: public/images/decoracion/corona.webp -->
          <img
            x-show="show"
            x-transition:enter="transition ease-out duration-1000 delay-300"
            x-transition:enter-start="opacity-0 scale-90"
            x-transition:enter-end="opacity-100 scale-100"
            src="/images/decoracion/corona.webp"
            alt=""
            aria-hidden="true"
            class="mx-auto mt-10 w-40"
          />

          <h1
            x-show="show"
            x-transition:enter="transition ease-out duration-1000 delay-500"
            x-transition:enter-start="opacity-0 translate-y-6 blur-sm"
            x-transition:enter-end="opacity-100 translate-y-0 blur-none"
            class="mt-3 font-script text-7xl leading-tight text-gold"
            x-text="$store.event.hero.titulo"
          ></h1>

          <!-- Foto en arco: public/images/hero.webp (vertical, ~900x1200px) -->
          <div class="relative mx-auto mt-8 w-[78%] max-w-[300px]">
            <!-- Ramas de bugambilia que asoman por los lados de la foto -->
            <img
              src="/images/decoracion/rama-bugambilia.webp"
              alt=""
              aria-hidden="true"
              loading="lazy"
              class="pointer-events-none absolute -left-[30%] -top-8 z-10 w-[55%]"
            />
            <img
              src="/images/decoracion/rama-bugambilia.webp"
              alt=""
              aria-hidden="true"
              loading="lazy"
              class="pointer-events-none absolute -right-[30%] top-[55%] z-10 w-[55%] -scale-x-100"
            />
            <div
              x-reveal.lg
              class="relative aspect-[3/4] overflow-hidden rounded-t-full border-2 border-gold bg-gradient-to-b from-[#f3e3df] to-[#ead6cf] p-1.5"
            >
              <div class="h-full w-full overflow-hidden rounded-t-full">
                <img
                  :src="$store.event.hero.imagen"
                  alt=""
                  fetchpriority="high"
                  decoding="async"
                  onerror="this.style.display='none'"
                  class="h-full w-full object-cover"
                />
              </div>
            </div>
          </div>

          <p
            x-show="$store.event.mensaje.texto"
            x-reveal.delay-150
            class="mx-auto mt-10 max-w-[19rem] whitespace-pre-line text-[13px] font-medium uppercase leading-relaxed tracking-[0.04em]"
            x-text="$store.event.mensaje.texto"
          ></p>
          <img src="/images/decoracion/rosas.webp" alt="" aria-hidden="true" loading="lazy" class="mx-auto mt-8 w-3/4" />
        </div>
      </section>

      <!-- Reproductor "Dale play" (controla la misma canción que el botón flotante) -->
      <template x-if="$store.event.tieneMusica">
        <section x-data="reproductor" class="w-full px-10 pt-4 pb-10 text-center">
          <p x-reveal class="mb-4 text-xs font-semibold uppercase tracking-[0.3em]">Dale play</p>
          <div x-reveal.delay-150 class="mx-auto max-w-[260px]">
            <div class="relative h-4 cursor-pointer" @click="buscar($event)">
              <div class="absolute inset-x-0 top-1/2 h-px -translate-y-1/2 bg-gold"></div>
              <div
                class="absolute top-1/2 h-2.5 w-2.5 -translate-x-1/2 -translate-y-1/2 rounded-full bg-gold"
                :style="`left: ${Math.max(progreso, 0.12) * 100}%`"
              ></div>
            </div>
            <div class="mt-2 flex items-center justify-between text-gold">
              <!-- Aleatorio (decorativo: sólo hay una canción) -->
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
              </svg>
              <button type="button" @click="reiniciar()" aria-label="Anterior">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg>
              </button>
              <button
                type="button"
                @click="toggle()"
                class="flex h-11 w-11 items-center justify-center rounded-full bg-gold text-paper"
                :aria-label="playing ? 'Pausar música' : 'Reproducir música'"
              >
                <svg x-show="!playing" class="ml-0.5 h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z" /></svg>
                <svg x-show="playing" x-cloak class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z" /></svg>
              </button>
              <button type="button" @click="reiniciar()" aria-label="Siguiente">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg>
              </button>
              <button type="button" @click="alternarRepetir()" :class="repetir ? 'opacity-100' : 'opacity-40'" aria-label="Repetir">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" />
                </svg>
              </button>
            </div>
          </div>
        </section>
      </template>

      <!-- Padres y padrinos (familia en event.config.js; sin grupos se oculta) -->
      <template x-if="$store.event.familia?.grupos?.length">
        <section class="relative w-full px-8 py-6 text-center">
          <p
            x-reveal
            class="mx-auto max-w-[17rem] text-[15px] font-semibold uppercase leading-snug tracking-[0.06em]"
            x-text="$store.event.familia.titulo"
          ></p>
          <template x-for="grupo in $store.event.familia.grupos" :key="grupo.titulo + grupo.nombres.join()">
            <div x-reveal.lg class="mt-6">
              <p
                x-show="grupo.titulo"
                class="mb-3 text-[15px] font-semibold uppercase tracking-[0.06em]"
                x-text="grupo.titulo"
              ></p>
              <template x-for="(nombre, i) in grupo.nombres" :key="nombre">
                <p
                  class="font-script text-[1.7rem] leading-snug"
                  x-text="nombre + (i < grupo.nombres.length - 1 ? ' &' : '')"
                ></p>
              </template>
            </div>
          </template>
          <template x-if="$store.event.familia.cierre">
            <div x-reveal.lg class="mt-8">
              <p class="text-[15px] font-semibold uppercase tracking-[0.06em]" x-text="$store.event.familia.cierre"></p>
              <p class="mt-1 text-4xl font-medium uppercase tracking-[0.12em] text-green">XV Años</p>
            </div>
          </template>
        </section>
      </template>

      <!-- Fecha: "Marzo / SÁBADO · 14 · 2026" -->
      <section x-data="fechaGrande" class="relative w-full px-6 pt-14 pb-10 text-center">
        <!-- Ramas rosas a los lados -->
        <img src="/images/decoracion/rama-rosa.webp" alt="" aria-hidden="true" loading="lazy" class="pointer-events-none absolute -left-20 -top-2 w-44 rotate-[25deg]" />
        <img src="/images/decoracion/rama-rosa.webp" alt="" aria-hidden="true" loading="lazy" class="pointer-events-none absolute -right-24 top-36 w-44 -scale-x-100 rotate-[-25deg]" />
        <div x-reveal.lg class="relative mx-auto max-w-[320px]">
          <p class="font-script text-3xl text-ink" x-text="mes"></p>
          <div class="mt-1 flex items-center justify-center gap-3">
            <div class="flex-1 border-y border-gold/70 py-2 text-sm font-semibold uppercase tracking-[0.12em]" x-text="diaSemana"></div>
            <p class="w-20 font-script text-7xl leading-none text-gold" x-text="dia"></p>
            <div class="flex-1 border-y border-gold/70 py-2 text-sm font-semibold uppercase tracking-[0.12em]" x-text="anio"></div>
          </div>
        </div>
      </section>

      <!-- Cuenta regresiva -->
      <section x-data="countdown" class="w-full px-4 py-10 text-center">
        <p x-reveal class="font-script text-4xl text-gold" x-text="$store.event.cuentaRegresiva.eyebrow"></p>
        <div x-show="!terminado" x-reveal.lg.scale class="mt-2 flex items-start justify-center text-green">
          <template
            x-for="(parte, i) in [[dias, 'Días'], [pad(horas), 'Horas'], [pad(minutos), 'Minutos'], [pad(segundos), 'Segundos']]"
            :key="parte[1]"
          >
            <div class="flex items-start">
              <span x-show="i > 0" class="px-1 text-5xl font-semibold leading-none">:</span>
              <div class="w-[4.2rem]">
                <span class="block text-5xl font-semibold leading-none tabular-nums" x-text="parte[0]"></span>
                <span class="mt-2 block text-[11px] font-semibold uppercase tracking-[0.04em]" x-text="parte[1]"></span>
              </div>
            </div>
          </template>
        </div>
        <p
          x-show="terminado"
          x-cloak
          class="font-script text-4xl text-green"
          x-text="$store.event.cuentaRegresiva.finalizado"
        ></p>
      </section>

      <!-- Calendario del mes con el día marcado -->
      <section x-data="calendario" class="w-full px-6 pt-6 pb-16 text-center">
        <p x-reveal class="font-script text-4xl text-gold">El Gran Día</p>
        <p x-reveal.delay-150 class="font-script text-3xl text-green" x-text="mes"></p>
        <div x-reveal.lg class="mx-auto mt-5 grid max-w-[330px] grid-cols-7 gap-y-3 text-sm">
          <template x-for="d in encabezados" :key="d">
            <span class="pb-2 text-xs font-semibold uppercase tracking-[0.05em]" x-text="d"></span>
          </template>
          <template x-for="c in celdas" :key="c.id">
            <span class="relative flex h-8 items-center justify-center">
              <svg
                x-show="c.dia === diaEvento"
                class="absolute h-10 w-10 text-gold"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="0.9"
                aria-hidden="true"
              >
                <path d="M12 20.5s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7.5 2.5c0 5.4-7.5 10-7.5 10z" />
              </svg>
              <span class="relative" :class="c.dia === diaEvento && 'font-semibold text-gold'" x-text="c.dia"></span>
            </span>
          </template>
        </div>
      </section>


      <!-- Misa y recepción (ceremonias en event.config.js) -->
      <section class="relative w-full px-6 py-10 text-center">
        <!-- Ramos en acuarela en las esquinas -->
        <img src="/images/decoracion/ramo-acuarela.webp" alt="" aria-hidden="true" loading="lazy" class="pointer-events-none absolute -left-14 top-2 w-36 -scale-x-100 opacity-90" />
        <img src="/images/decoracion/ramo-acuarela.webp" alt="" aria-hidden="true" loading="lazy" class="pointer-events-none absolute -right-14 top-[45%] w-36 opacity-90" />
        <template x-for="c in $store.event.ceremonias" :key="c.titulo">
          <div x-reveal.lg class="relative py-8">
            <span class="mx-auto block h-11 w-11 text-green" x-html="$icono(c.icono)"></span>
            <p class="mt-1 font-script text-4xl text-gold" x-text="c.titulo"></p>
            <p class="mt-3 text-lg font-bold uppercase tracking-[0.06em]" x-text="c.hora"></p>
            <p class="mt-1 text-[15px] font-semibold uppercase tracking-[0.04em]" x-text="c.lugar"></p>
            <p class="text-[13px] font-medium uppercase italic tracking-[0.02em]" x-text="c.direccion"></p>
            <a
              x-show="c.mapsUrl"
              :href="c.mapsUrl"
              target="_blank"
              rel="noopener"
              class="mt-4 inline-flex items-center gap-1.5 rounded-md bg-gold px-5 py-2 text-xs font-semibold uppercase tracking-[0.08em] text-paper shadow-sm transition-opacity hover:opacity-85"
            >
              <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" />
              </svg>
              Ver ubicación
            </a>
          </div>
        </template>
      </section>

      <!--
        Galería de fotos destacadas: carrusel con bordes de papel rasgado.
        Fotos verticales (4:5) en public/images/gallery/1.webp, 2.webp, …
        (galeria.fotos en event.config.js). Al tocar una se abre el visor.
      -->
      <template x-if="$store.event.tieneGaleria">
        <section id="fotos-destacadas" x-data="gallery" class="relative w-full py-6">
          <div x-data="carrusel" @pointerdown="detener()" class="relative" x-reveal.lg>
            <div
              class="relative aspect-[4/5] w-full bg-gradient-to-b from-[#f0dcd6] to-[#e6cdc5] [mask-image:url('/images/rasgado.svg')] [mask-size:100%_100%]"
            >
              <div
                x-ref="pista"
                @scroll.debounce.50ms="alDeslizar()"
                class="flex h-full snap-x snap-mandatory overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
              >
                <template x-for="(photo, i) in photos" :key="i">
                  <button type="button" @click="show(i)" class="h-full w-full shrink-0 snap-center" :aria-label="`Ver foto ${i + 1}`">
                    <img
                      :src="photo"
                      :alt="`Foto ${i + 1} de ${$store.event.hero.titulo}`"
                      :loading="i === 0 ? 'eager' : 'lazy'"
                      decoding="async"
                      class="h-full w-full object-cover"
                    />
                  </button>
                </template>
              </div>
            </div>

            <!-- Flechas (útiles en computadora; en el celular se desliza) -->
            <button
              type="button"
              @click="detener(); ir(activo - 1)"
              class="absolute left-3 top-1/2 z-20 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-paper/80 pb-0.5 text-3xl leading-none text-gold shadow-sm"
              aria-label="Foto anterior"
            >&#8249;</button>
            <button
              type="button"
              @click="detener(); ir(activo + 1)"
              class="absolute right-3 top-1/2 z-20 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-paper/80 pb-0.5 text-3xl leading-none text-gold shadow-sm"
              aria-label="Foto siguiente"
            >&#8250;</button>

            <!-- Puntos -->
            <div class="mt-12 flex justify-center gap-2">
              <template x-for="(photo, i) in photos" :key="i">
                <button
                  type="button"
                  @click="detener(); ir(i)"
                  class="h-2 rounded-full transition-all duration-300"
                  :class="activo === i ? 'w-6 bg-gold' : 'w-2 bg-gold/35'"
                  :aria-label="`Ir a la foto ${i + 1}`"
                ></button>
              </template>
            </div>
          </div>

          <!-- Guirnaldas de bugambilia sobre las esquinas -->
          <img src="/images/decoracion/guirnalda-bugambilia.webp" alt="" aria-hidden="true" loading="lazy" class="pointer-events-none absolute -left-6 -top-8 z-10 w-2/3" />
          <img src="/images/decoracion/guirnalda-bugambilia.webp" alt="" aria-hidden="true" loading="lazy" class="pointer-events-none absolute bottom-16 -right-6 z-10 w-2/3 -scale-x-100" />

            <!-- Visor a pantalla completa -->
            <div
              x-show="open"
              x-cloak
              @keydown.escape.window="close()"
              @keydown.arrow-right.window="next()"
              @keydown.arrow-left.window="prev()"
              x-transition:enter="transition ease-out duration-300"
              x-transition:enter-start="opacity-0"
              x-transition:enter-end="opacity-100"
              x-transition:leave="transition ease-in duration-200"
              x-transition:leave-start="opacity-100"
              x-transition:leave-end="opacity-0"
              class="fixed inset-0 z-50 flex items-center justify-center bg-ink/95 p-4"
              @click.self="close()"
            >
              <button
                type="button"
                @click="close()"
                class="absolute top-[max(1.25rem,env(safe-area-inset-top))] right-5 text-paper/70 hover:text-paper text-3xl leading-none"
                aria-label="Cerrar"
              >
                &times;
              </button>
              <button
                type="button"
                @click="prev()"
                class="absolute left-2 sm:left-6 text-paper/60 hover:text-paper text-4xl px-2"
                aria-label="Anterior"
              >
                &#8249;
              </button>
              <img
                :src="photos[index]"
                :alt="`Foto ${index + 1}`"
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 scale-95"
                x-transition:enter-end="opacity-100 scale-100"
                :key="index"
                class="max-h-[85svh] max-w-full object-contain"
              />
              <button
                type="button"
                @click="next()"
                class="absolute right-2 sm:right-6 text-paper/60 hover:text-paper text-4xl px-2"
                aria-label="Siguiente"
              >
                &#8250;
              </button>
            </div>
        </section>
      </template>

      <!-- Itinerario: línea de tiempo con íconos que alternan de lado -->
      <template x-if="$store.event.itinerario?.length">
        <section class="relative w-full px-6 pt-10 pb-14 text-center">
          <div x-reveal class="text-gold">
            <p class="font-script text-4xl leading-none">Itinerario</p>
            <p class="my-1 text-xs font-semibold uppercase tracking-[0.2em] text-ink">de</p>
            <p class="font-script text-4xl leading-none">actividades</p>
          </div>
          <div class="relative mx-auto mt-10 max-w-[300px]">
            <div class="absolute bottom-3 left-1/2 top-3 w-0.5 -translate-x-1/2 bg-green"></div>
            <template x-for="(paso, i) in $store.event.itinerario" :key="paso.hora + paso.actividad">
              <div x-reveal class="relative grid grid-cols-[1fr_2.5rem_1fr] items-center py-4">
                <div class="flex justify-end pr-3" :class="i % 2 ? 'text-right' : ''">
                  <span x-show="i % 2 === 0" class="block h-9 w-9 text-green" x-html="$icono(paso.icono)"></span>
                  <div x-show="i % 2 === 1">
                    <p class="text-[13px] font-bold uppercase tracking-[0.06em]" x-text="paso.hora"></p>
                    <p class="text-[11px] font-semibold uppercase tracking-[0.12em]" x-text="paso.actividad"></p>
                  </div>
                </div>
                <span class="mx-auto h-2.5 w-2.5 rounded-full bg-green"></span>
                <div class="flex justify-start pl-3 text-left">
                  <span x-show="i % 2 === 1" class="block h-9 w-9 text-green" x-html="$icono(paso.icono)"></span>
                  <div x-show="i % 2 === 0">
                    <p class="text-[13px] font-bold uppercase tracking-[0.06em]" x-text="paso.hora"></p>
                    <p class="text-[11px] font-semibold uppercase tracking-[0.12em]" x-text="paso.actividad"></p>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </section>
      </template>

      <!-- Hoteles cercanos (hoteles.lista vacía oculta la sección) -->
      <template x-if="$store.event.hoteles?.lista?.length">
        <section class="relative w-full px-8 py-12 text-center">
          <img src="/images/decoracion/rama-rosa.webp" alt="" aria-hidden="true" loading="lazy" class="pointer-events-none absolute -right-24 top-0 w-44 -scale-x-100 rotate-[-25deg]" />
          <span x-reveal class="mx-auto block h-11 w-11 text-green" x-html="$icono('hotel')"></span>
          <p x-reveal class="mt-1 font-script text-4xl text-gold">Hoteles cercanos</p>
          <p
            x-show="$store.event.hoteles.nota"
            x-reveal.delay-150
            class="mx-auto mt-3 max-w-[19rem] text-[13px] font-semibold uppercase leading-relaxed tracking-[0.03em]"
            x-text="$store.event.hoteles.nota"
          ></p>
          <div class="mx-auto mt-6 max-w-[320px] space-y-4">
            <template x-for="(h, i) in $store.event.hoteles.lista" :key="i">
              <div x-reveal.lg class="border border-gold/50 bg-paper/70 px-5 py-5">
                <p class="text-[15px] font-bold uppercase tracking-[0.05em]" x-text="h.nombre"></p>
                <p x-show="h.direccion" class="text-[13px] font-medium uppercase italic tracking-[0.02em]" x-text="h.direccion"></p>
                <p x-show="h.distancia" class="mt-1 text-[12px] font-semibold uppercase tracking-[0.08em] text-green" x-text="h.distancia"></p>
                <p x-show="h.codigo" class="mt-2 text-[12px] font-semibold uppercase tracking-[0.04em]">
                  Código de descuento: <span class="text-gold" x-text="h.codigo"></span>
                </p>
                <div class="mt-3 flex flex-wrap justify-center gap-2">
                  <a
                    x-show="h.telefono"
                    :href="`tel:${String(h.telefono).replace(/[^\d+]/g, '')}`"
                    class="rounded-md border border-gold px-3 py-1.5 text-[11px] font-semibold uppercase tracking-[0.08em] text-gold transition-colors hover:bg-gold hover:text-paper"
                  >Llamar</a>
                  <a
                    x-show="h.mapsUrl"
                    :href="h.mapsUrl"
                    target="_blank"
                    rel="noopener"
                    class="rounded-md border border-gold px-3 py-1.5 text-[11px] font-semibold uppercase tracking-[0.08em] text-gold transition-colors hover:bg-gold hover:text-paper"
                  >Ubicación</a>
                  <a
                    x-show="h.url"
                    :href="h.url"
                    target="_blank"
                    rel="noopener"
                    class="rounded-md bg-gold px-3 py-1.5 text-[11px] font-semibold uppercase tracking-[0.08em] text-paper transition-opacity hover:opacity-85"
                  >Reservar</a>
                </div>
              </div>
            </template>
          </div>
        </section>
      </template>

      <!-- Código de vestimenta (dresscode.titulo vacío lo oculta) -->
      <template x-if="$store.event.tieneDresscode">
        <section class="relative w-full px-8 py-12 text-center">
          <p x-reveal class="font-script text-4xl text-gold">Código de vestimenta</p>
          <p x-reveal.delay-150 class="mt-1 text-lg font-semibold uppercase tracking-[0.06em]" x-text="$store.event.dresscode.titulo"></p>
          <div x-reveal.lg class="mt-4 flex items-end justify-center gap-1 text-ink">
            <span class="block h-16 w-16" x-html="$icono('traje')"></span>
            <span class="block h-16 w-16" x-html="$icono('vestido')"></span>
          </div>
          <p
            x-reveal.delay-150
            class="mx-auto mt-5 max-w-[19rem] text-[13px] font-semibold uppercase leading-relaxed tracking-[0.03em]"
            x-text="$store.event.dresscode.nota"
          ></p>
        </section>
      </template>

      <!-- Segunda foto con bordes rasgados: fotos.regalos -->
      <template x-if="$store.event.fotos.regalos">
        <section class="relative w-full py-6">
          <div
            x-reveal.lg
            class="relative aspect-[4/5] w-full bg-gradient-to-b from-[#f0dcd6] to-[#e6cdc5] [mask-image:url('/images/rasgado.svg')] [mask-size:100%_100%]"
          >
            <img :src="$store.event.fotos.regalos" alt="" loading="lazy" onerror="this.style.display='none'" class="h-full w-full object-cover" />
          </div>
          <img src="/images/decoracion/rosas.webp" alt="" aria-hidden="true" loading="lazy" class="pointer-events-none absolute -bottom-4 left-1/2 z-10 w-3/4 -translate-x-1/2" />
        </section>
      </template>

      <!-- Sugerencia de regalos (regalos.texto vacío lo oculta) -->
      <!-- <template x-if="$store.event.regalos?.texto"> -->
      <!--   <section x-data="{ copiado: false }" class="relative w-full px-8 py-12 text-center"> -->
      <!--     <span x-reveal class="mx-auto block h-11 w-11 text-green" x-html="$icono('regalo')"></span> -->
      <!--     <p x-reveal class="mt-1 font-script text-4xl text-gold">Sugerencia de regalos</p> -->
      <!--     <p -->
      <!--       x-reveal.delay-150 -->
      <!--       class="mx-auto mt-3 max-w-[19rem] text-[13px] font-semibold uppercase leading-relaxed tracking-[0.03em]" -->
      <!--       x-text="$store.event.regalos.texto" -->
      <!--     ></p> -->
      <!--     <template x-if="$store.event.regalos.datos?.length"> -->
      <!--       <div x-reveal.lg class="mt-6"> -->
      <!--         <span class="mx-auto block h-10 w-10 text-green" x-html="$icono('tarjeta')"></span> -->
      <!--         <template x-for="linea in $store.event.regalos.datos" :key="linea"> -->
      <!--           <p class="text-[13px] font-bold uppercase leading-snug tracking-[0.05em]" x-text="linea"></p> -->
      <!--         </template> -->
      <!--         <button -->
      <!--           x-show="$store.event.regalos.copiar" -->
      <!--           type="button" -->
      <!--           @click="navigator.clipboard?.writeText($store.event.regalos.copiar); copiado = true; setTimeout(() => (copiado = false), 2000)" -->
      <!--           class="mt-4 rounded-md border border-gold px-4 py-1.5 text-[11px] font-semibold uppercase tracking-[0.1em] text-gold transition-colors hover:bg-gold hover:text-paper" -->
      <!--           x-text="copiado ? '¡Copiado!' : 'Copiar cuenta'" -->
      <!--         ></button> -->
      <!--       </div> -->
      <!--     </template> -->
      <!--   </section> -->
      <!-- </template> -->

      <!-- Fotos de invitados: enlace a /fotos/ (fotosInvitados.habilitado) -->
      <template x-if="$store.event.tieneFotosInvitados">
        <section class="w-full px-6 py-20 text-center">
          <p x-reveal class="uppercase tracking-[0.25em] text-xs text-ink/50 mb-3" x-text="$store.event.fotosInvitados.eyebrow"></p>
          <p x-reveal.delay-150 class="font-serif text-3xl sm:text-4xl mb-6" x-text="$store.event.fotosInvitados.titulo"></p>
          <p x-reveal.delay-300 class="text-sm text-ink/70 max-w-xs mx-auto mb-8" x-text="$store.event.fotosInvitados.nota"></p>
          <a
            x-reveal.delay-500
            :href="$store.event.fotosInvitados.url"
            class="inline-block text-xs uppercase tracking-[0.2em] border border-ink/40 px-5 py-2.5 hover:bg-ink hover:text-paper transition-colors"
            x-text="$store.event.fotosInvitados.boton"
          ></a>
        </section>
      </template>

      <!-- RSVP: por WhatsApp (rsvp.modo: 'whatsapp') o con pases (rsvp.modo: 'pases') -->
      <template x-if="$store.event.tieneRsvp">
        <section id="rsvp" class="w-full px-8 py-12">
          <div class="max-w-sm mx-auto text-center">
            <span x-reveal class="mx-auto block h-11 w-11 text-green" x-html="$icono('confirmar')"></span>
            <p x-reveal class="mt-1 font-script text-4xl text-gold" x-text="$store.event.rsvp.titulo"></p>

            <!-- Opciones de WhatsApp: modo 'whatsapp', o respaldo sin enlace personal -->
            <template x-if="!$store.event.tieneRsvpPases">
              <div x-data="rsvp">
                <p x-reveal.delay-150 class="mx-auto mt-1 max-w-[17rem] text-[13px] font-semibold uppercase leading-relaxed tracking-[0.03em]" x-text="nota"></p>
                <!-- Con una sola opción, un botón "Confirmar aquí"; con varias, una lista -->
                <template x-if="opciones.length === 1">
                  <button
                    type="button"
                    @click="enviar(opciones[0])"
                    x-reveal.delay-300
                    class="mt-5 rounded-md bg-gold px-6 py-2 text-xs font-semibold uppercase tracking-[0.08em] text-paper shadow-sm transition-opacity hover:opacity-85"
                    x-text="$store.event.rsvp.boton || 'Confirmar aquí'"
                  ></button>
                </template>
                <template x-if="opciones.length > 1">
                  <div class="mt-6 grid grid-cols-2 gap-3 text-left">
                    <template x-for="(opcion, i) in opciones" :key="opcion">
                      <button
                        type="button"
                        @click="enviar(opcion)"
                        x-reveal.delay-300
                        :style="`transition-delay: ${i * 80}ms`"
                        class="rounded-md border border-gold/50 px-4 py-3.5 text-sm leading-snug hover:bg-gold hover:text-paper transition-colors"
                        x-text="opcion"
                      ></button>
                    </template>
                  </div>
                </template>
              </div>
            </template>

            <!-- Pases: cada invitado confirma con su enlace (/?i=<código>) -->
            <template x-if="$store.event.tieneRsvpPases">
              <div x-data="rsvpPases" class="text-left">
                <p x-show="estado === 'cargando'" class="text-sm text-ink/60 text-center">Cargando tu invitación…</p>

                <div x-show="estado === 'sin_enlace'" class="text-center">
                  <p class="text-sm text-ink/60 max-w-xs mx-auto" x-text="error || $store.event.rsvp.sinEnlace"></p>
                  <template x-if="$store.event.rsvp.conWhatsapp">
                    <div x-data="rsvp" class="grid grid-cols-2 gap-3 text-left mt-8">
                      <template x-for="opcion in opciones" :key="opcion">
                        <button
                          type="button"
                          @click="enviar(opcion)"
                          class="border border-gold/50 px-4 py-3.5 text-xs leading-snug hover:bg-gold hover:text-paper transition-colors"
                          x-text="opcion"
                        ></button>
                      </template>
                    </div>
                  </template>
                </div>

                <div x-show="estado === 'error'" class="text-center">
                  <p class="text-sm text-ink/60 mb-6" x-text="error"></p>
                  <button
                    type="button"
                    @click="cargar()"
                    class="text-xs uppercase tracking-[0.2em] border border-gold/60 px-5 py-2.5 hover:bg-gold hover:text-paper transition-colors"
                  >
                    Reintentar
                  </button>
                </div>

                <template x-if="estado === 'listo'">
                  <div>
                    <p class="font-script text-3xl text-center" x-text="pase.nombre"></p>

                    <!-- Formulario -->
                    <form x-show="editando" @submit.prevent="enviar()" class="mt-6">
                      <p class="text-sm text-ink/60 text-center mb-6" x-text="$store.event.rsvp.nota"></p>
                      <ul class="space-y-2">
                        <template x-for="persona in personas" :key="persona.id">
                          <li class="border border-gold/40 px-4 py-3">
                            <label class="flex items-center gap-3 cursor-pointer">
                              <input type="checkbox" x-model="persona.asiste" class="size-4 accent-[#b39457]" />
                              <span class="flex-1 text-sm" x-text="persona.libre ? 'Acompañante' : persona.nombre"></span>
                              <span x-show="persona.nino" class="text-[10px] uppercase tracking-[0.2em] text-ink/60">Niño/a</span>
                            </label>
                            <input
                              x-show="persona.libre && persona.asiste"
                              x-model="persona.nombre"
                              @input="error = ''"
                              type="text"
                              maxlength="80"
                              placeholder="Nombre de tu acompañante"
                              class="mt-3 w-full bg-transparent border-b border-gold/50 py-1.5 text-sm placeholder:text-ink/40 focus:outline-none focus:border-gold"
                            />
                          </li>
                        </template>
                      </ul>

                      <textarea
                        x-model="mensaje"
                        rows="2"
                        maxlength="500"
                        placeholder="Mensaje para los festejados (opcional)"
                        class="mt-6 w-full bg-transparent border border-gold/40 px-4 py-3 text-sm placeholder:text-ink/40 focus:outline-none focus:border-gold"
                      ></textarea>

                      <p x-show="error" class="mt-4 text-sm text-center text-red-700" x-text="error"></p>

                      <button
                        type="submit"
                        :disabled="enviando"
                        class="mt-6 w-full bg-gold text-paper rounded-md py-3.5 text-xs uppercase tracking-[0.2em] disabled:opacity-60"
                        x-text="textoBoton"
                      ></button>
                      <button
                        x-show="personas.length > 1 && asistentes.length"
                        type="button"
                        @click="noAsistiremos()"
                        :disabled="enviando"
                        class="mt-3 w-full border border-gold/50 py-3 text-xs uppercase tracking-[0.2em] hover:bg-gold/10"
                      >
                        No podremos asistir
                      </button>
                      <button
                        x-show="respondio"
                        type="button"
                        @click="cancelar()"
                        class="mt-3 w-full py-2 text-xs text-ink/60 underline underline-offset-4"
                      >
                        Cancelar
                      </button>
                      <p x-show="fechaLimite" class="mt-6 text-xs text-ink/60 text-center">
                        Puedes confirmar o cambiar tu respuesta hasta el <span x-text="fechaLimite"></span>.
                      </p>
                    </form>

                    <!-- Respuesta guardada -->
                    <div x-show="!editando" class="mt-6 text-center">
                      <template x-if="respondio">
                        <div>
                          <p class="text-xs uppercase tracking-[0.25em] text-ink/60 mb-3" x-text="$store.event.rsvp.gracias"></p>
                          <p class="text-sm" x-text="resumen"></p>
                          <p x-show="mensaje" class="mt-4 text-sm text-ink/60 italic" x-text="`“${mensaje}”`"></p>
                        </div>
                      </template>
                      <p x-show="!respondio" class="text-sm text-ink/60">La fecha para confirmar ya pasó.</p>
                      <p x-show="error" class="mt-4 text-sm text-red-700" x-text="error"></p>
                      <template x-if="abierta">
                        <div>
                          <button
                            type="button"
                            @click="cambiar()"
                            class="mt-8 text-xs uppercase tracking-[0.2em] border border-gold/60 px-5 py-2.5 hover:bg-gold hover:text-paper transition-colors"
                          >
                            Cambiar respuesta
                          </button>
                          <p x-show="fechaLimite" class="mt-4 text-xs text-ink/60">
                            Hasta el <span x-text="fechaLimite"></span>.
                          </p>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </section>
      </template>

      <!-- Cierre: notas, "¡Te esperamos!", foto enmarcada y foto final -->
      <section class="relative w-full px-8 pt-12 text-center">
        <template x-for="nota in $store.event.notas" :key="nota">
          <p x-reveal class="mx-auto mb-8 max-w-[19rem] text-[13px] font-semibold uppercase leading-relaxed tracking-[0.03em]" x-text="nota"></p>
        </template>
        <p x-reveal.lg class="mt-4 font-script text-5xl text-gold" x-text="$store.event.footer"></p>
        <template x-if="$store.event.fotos.marco">
          <div x-reveal.lg class="mx-auto mt-8 aspect-square w-40 border-2 border-gold bg-[#ead6cf] p-1">
            <img :src="$store.event.fotos.marco" alt="" loading="lazy" onerror="this.style.display='none'" class="h-full w-full object-cover" />
          </div>
        </template>
      </section>
      <template x-if="$store.event.fotos.final">
        <div class="relative mt-10 w-full">
          <img src="/images/decoracion/ramo-acuarela.webp" alt="" aria-hidden="true" loading="lazy" class="pointer-events-none absolute -right-8 -top-24 z-10 w-1/2" />
          <!-- Sólo el borde de arriba rasgado: la máscara se estira para esconder el de abajo -->
          <div class="aspect-[3/4] w-full bg-gradient-to-b from-[#f0dcd6] to-[#e6cdc5] [mask-image:url('/images/rasgado.svg')] [mask-size:100%_106%] [mask-position:top]">
            <img :src="$store.event.fotos.final" alt="" loading="lazy" onerror="this.style.display='none'" class="h-full w-full object-cover" />
          </div>
        </div>
      </template>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
