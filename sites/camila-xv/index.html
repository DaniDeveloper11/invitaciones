<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Camila XV" />
    <meta name="theme-color" content="#f7f3ee" />

    <!--
      Vista previa al compartir (WhatsApp, Facebook, Telegram, iMessage…).
      La dirección sale de VITE_SITE_URL (archivo .env): absoluta, con https://
      y terminada en "/". Cámbiala ahí, no aquí.
      La imagen debe ser JPG o PNG de 1200x630 en public/images/og.jpg — WhatsApp
      descarta WebP y las imágenes pesadas (mantenla por debajo de 300 KB).
    -->
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:title" content="Camila XV" />
    <meta property="og:description" content="Camila XV" />
    <meta property="og:image" content="%VITE_SITE_URL%images/og.jpg" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%images/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Camila XV" />
    <meta name="twitter:image" content="%VITE_SITE_URL%images/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
    <title>Camila XV</title>
  </head>
  <body class="bg-paper text-ink font-sans antialiased">
    <!--
      Esta plantilla no contiene datos: todo sale de src/event.config.js y se lee
      con `$store.event`. Para cambiar textos, fotos o colores edita ese archivo.
      Para cambiar el diseño, edita este HTML libremente.
    -->
    <div id="app" x-data class="relative mx-auto flex min-h-screen w-full max-w-[480px] flex-col md:shadow-2xl">
      <!-- Música de fondo (public/audio/song.mp3) -->
      <template x-if="$store.event.tieneMusica">
        <div x-data="audioPlayer" class="fixed bottom-5 right-5 z-40">
          <audio
            id="musica"
            x-ref="audio"
            :src="src"
            loop
            preload="auto"
            @play="playing = true"
            @pause="playing = false"
          ></audio>
          <button
            type="button"
            @click="toggle()"
            class="flex h-12 w-12 items-center justify-center rounded-full border border-ink/20 bg-paper/90 text-ink shadow-sm backdrop-blur transition-colors hover:border-ink/50"
            :aria-label="playing ? 'Pausar música' : 'Reproducir música'"
          >
            <svg
              class="h-5 w-5"
              :class="{ 'animate-[spin_4s_linear_infinite]': playing }"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
            >
              <circle cx="12" cy="12" r="9" />
              <circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none" />
              <line x1="12" y1="3" x2="12" y2="5" />
            </svg>
          </button>
        </div>
      </template>

      <!--
        Portada: arco de flores, "Mis XV Años", corona, nombre, foto en arco
        y la frase de mensaje.texto. Las acuarelas van en public/images/decoracion/.
      -->
      <section
        x-data="{ show: false }"
        x-init="setTimeout(() => (show = true), 150)"
        class="relative w-full overflow-hidden px-6 pb-16 text-center"
      >
        <!-- public/images/decoracion/arco.webp — arco de flores (PNG/WebP transparente, ~1000px de ancho) -->
        <img
          src="/images/decoracion/arco.webp"
          alt=""
          aria-hidden="true"
          onerror="this.remove()"
          class="pointer-events-none absolute inset-x-0 top-0 w-full"
        />

        <div class="relative pt-[max(5.5rem,env(safe-area-inset-top))]">
          <h2
            x-show="show"
            x-transition:enter="transition ease-out duration-1000"
            x-transition:enter-start="opacity-0 translate-y-4"
            x-transition:enter-end="opacity-100 translate-y-0"
            class="whitespace-pre-line font-script text-6xl leading-[0.9] text-green"
            x-text="$store.event.hero.eyebrow"
          ></h2>

          <!-- Corona -->
          <svg
            x-show="show"
            x-transition:enter="transition ease-out duration-1000 delay-300"
            x-transition:enter-start="opacity-0 scale-90"
            x-transition:enter-end="opacity-100 scale-100"
            class="mx-auto mt-12 h-16 w-36 text-[#a9a6a8]"
            viewBox="0 0 160 70"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M14 58 C 40 52 120 52 146 58" />
            <path d="M18 62 C 44 56 116 56 142 62" />
            <path d="M16 57 L 22 34 L 38 46 L 50 22 L 64 42 L 80 8 L 96 42 L 110 22 L 122 46 L 138 34 L 144 57" />
            <path d="M30 52 L 36 40 M 58 50 L 64 42 M 102 50 L 96 42 M 130 52 L 124 40" />
            <circle cx="80" cy="6" r="3" fill="currentColor" />
            <circle cx="50" cy="20" r="2.4" fill="currentColor" />
            <circle cx="110" cy="20" r="2.4" fill="currentColor" />
            <circle cx="22" cy="32" r="2" fill="currentColor" />
            <circle cx="138" cy="32" r="2" fill="currentColor" />
            <path d="M80 26 L 86 36 L 80 46 L 74 36 Z" />
            <circle cx="80" cy="36" r="2" fill="currentColor" />
            <g fill="currentColor" stroke="none">
              <circle cx="34" cy="55" r="1.5" /><circle cx="48" cy="53.5" r="1.5" /><circle cx="64" cy="52.6" r="1.5" />
              <circle cx="80" cy="52.3" r="1.5" /><circle cx="96" cy="52.6" r="1.5" /><circle cx="112" cy="53.5" r="1.5" />
              <circle cx="126" cy="55" r="1.5" />
            </g>
          </svg>

          <h1
            x-show="show"
            x-transition:enter="transition ease-out duration-1000 delay-500"
            x-transition:enter-start="opacity-0 translate-y-6 blur-sm"
            x-transition:enter-end="opacity-100 translate-y-0 blur-none"
            class="mt-3 font-script text-7xl leading-tight text-gold"
            x-text="$store.event.hero.titulo"
          ></h1>

          <!-- Foto en arco: public/images/hero.webp (vertical, ~900x1200px) -->
          <div class="relative mx-auto mt-8 w-[78%] max-w-[300px]">
            <!-- public/images/decoracion/lateral.webp — racimos colgantes a los lados -->
            <img
              src="/images/decoracion/lateral.webp"
              alt=""
              aria-hidden="true"
              onerror="this.remove()"
              class="pointer-events-none absolute -left-[22%] -top-4 w-[35%]"
            />
            <img
              src="/images/decoracion/lateral.webp"
              alt=""
              aria-hidden="true"
              onerror="this.remove()"
              class="pointer-events-none absolute -right-[22%] top-1/3 w-[35%] -scale-x-100"
            />
            <div
              x-reveal.lg
              class="relative aspect-[3/4] overflow-hidden rounded-t-full border-2 border-gold bg-gradient-to-b from-[#f3e3df] to-[#ead6cf] p-1.5"
            >
              <div class="h-full w-full overflow-hidden rounded-t-full">
                <img
                  :src="$store.event.hero.imagen"
                  alt=""
                  fetchpriority="high"
                  decoding="async"
                  onerror="this.style.display='none'"
                  class="h-full w-full object-cover"
                />
              </div>
            </div>
          </div>

          <p
            x-show="$store.event.mensaje.texto"
            x-reveal.delay-150
            class="mx-auto mt-10 max-w-[19rem] whitespace-pre-line text-[13px] font-medium uppercase leading-relaxed tracking-[0.04em]"
            x-text="$store.event.mensaje.texto"
          ></p>
        </div>
      </section>

      <!-- Reproductor "Dale play" (controla la misma canción que el botón flotante) -->
      <template x-if="$store.event.tieneMusica">
        <section x-data="reproductor" class="w-full px-10 pt-4 pb-10 text-center">
          <p x-reveal class="mb-4 text-xs font-semibold uppercase tracking-[0.3em]">Dale play</p>
          <div x-reveal.delay-150 class="mx-auto max-w-[260px]">
            <div class="relative h-4 cursor-pointer" @click="buscar($event)">
              <div class="absolute inset-x-0 top-1/2 h-px -translate-y-1/2 bg-gold"></div>
              <div
                class="absolute top-1/2 h-2.5 w-2.5 -translate-x-1/2 -translate-y-1/2 rounded-full bg-gold"
                :style="`left: ${Math.max(progreso, 0.12) * 100}%`"
              ></div>
            </div>
            <div class="mt-2 flex items-center justify-between text-gold">
              <!-- Aleatorio (decorativo: sólo hay una canción) -->
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
              </svg>
              <button type="button" @click="reiniciar()" aria-label="Anterior">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg>
              </button>
              <button
                type="button"
                @click="toggle()"
                class="flex h-11 w-11 items-center justify-center rounded-full bg-gold text-paper"
                :aria-label="playing ? 'Pausar música' : 'Reproducir música'"
              >
                <svg x-show="!playing" class="ml-0.5 h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z" /></svg>
                <svg x-show="playing" x-cloak class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z" /></svg>
              </button>
              <button type="button" @click="reiniciar()" aria-label="Siguiente">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg>
              </button>
              <button type="button" @click="alternarRepetir()" :class="repetir ? 'opacity-100' : 'opacity-40'" aria-label="Repetir">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" />
                </svg>
              </button>
            </div>
          </div>
        </section>
      </template>

      <!-- Padres y padrinos (familia en event.config.js; sin grupos se oculta) -->
      <template x-if="$store.event.familia?.grupos?.length">
        <section class="relative w-full px-8 py-6 text-center">
          <p
            x-reveal
            class="mx-auto max-w-[17rem] text-[15px] font-semibold uppercase leading-snug tracking-[0.06em]"
            x-text="$store.event.familia.titulo"
          ></p>
          <template x-for="grupo in $store.event.familia.grupos" :key="grupo.titulo + grupo.nombres.join()">
            <div x-reveal.lg class="mt-6">
              <p
                x-show="grupo.titulo"
                class="mb-3 text-[15px] font-semibold uppercase tracking-[0.06em]"
                x-text="grupo.titulo"
              ></p>
              <template x-for="(nombre, i) in grupo.nombres" :key="nombre">
                <p
                  class="font-script text-[1.7rem] leading-snug"
                  x-text="nombre + (i < grupo.nombres.length - 1 ? ' &' : '')"
                ></p>
              </template>
            </div>
          </template>
          <template x-if="$store.event.familia.cierre">
            <div x-reveal.lg class="mt-8">
              <p class="text-[15px] font-semibold uppercase tracking-[0.06em]" x-text="$store.event.familia.cierre"></p>
              <p class="mt-1 text-4xl font-medium uppercase tracking-[0.12em] text-green">XV Años</p>
            </div>
          </template>
        </section>
      </template>

      <!-- Fecha: "Marzo / SÁBADO · 14 · 2026" -->
      <section x-data="fechaGrande" class="relative w-full px-6 pt-14 pb-10 text-center">
        <!-- public/images/decoracion/lateral.webp — racimos a los lados -->
        <img src="/images/decoracion/lateral.webp" alt="" aria-hidden="true" onerror="this.remove()" class="pointer-events-none absolute -left-4 -top-10 w-24" />
        <img src="/images/decoracion/lateral.webp" alt="" aria-hidden="true" onerror="this.remove()" class="pointer-events-none absolute -right-4 top-10 w-28 -scale-x-100" />
        <div x-reveal.lg class="relative mx-auto max-w-[320px]">
          <p class="font-script text-3xl text-ink" x-text="mes"></p>
          <div class="mt-1 flex items-center justify-center gap-3">
            <div class="flex-1 border-y border-gold/70 py-2 text-sm font-semibold uppercase tracking-[0.12em]" x-text="diaSemana"></div>
            <p class="w-20 font-script text-7xl leading-none text-gold" x-text="dia"></p>
            <div class="flex-1 border-y border-gold/70 py-2 text-sm font-semibold uppercase tracking-[0.12em]" x-text="anio"></div>
          </div>
        </div>
      </section>

      <!-- Cuenta regresiva -->
      <section x-data="countdown" class="w-full px-4 py-10 text-center">
        <p x-reveal class="font-script text-4xl text-gold" x-text="$store.event.cuentaRegresiva.eyebrow"></p>
        <div x-show="!terminado" x-reveal.lg.scale class="mt-2 flex items-start justify-center text-green">
          <template
            x-for="(parte, i) in [[dias, 'Días'], [pad(horas), 'Horas'], [pad(minutos), 'Minutos'], [pad(segundos), 'Segundos']]"
            :key="parte[1]"
          >
            <div class="flex items-start">
              <span x-show="i > 0" class="px-1 text-5xl font-semibold leading-none">:</span>
              <div class="w-[4.2rem]">
                <span class="block text-5xl font-semibold leading-none tabular-nums" x-text="parte[0]"></span>
                <span class="mt-2 block text-[11px] font-semibold uppercase tracking-[0.04em]" x-text="parte[1]"></span>
              </div>
            </div>
          </template>
        </div>
        <p
          x-show="terminado"
          x-cloak
          class="font-script text-4xl text-green"
          x-text="$store.event.cuentaRegresiva.finalizado"
        ></p>
      </section>

      <!-- Calendario del mes con el día marcado -->
      <section x-data="calendario" class="w-full px-6 pt-6 pb-16 text-center">
        <p x-reveal class="font-script text-4xl text-gold">El Gran Día</p>
        <p x-reveal.delay-150 class="font-script text-3xl text-green" x-text="mes"></p>
        <div x-reveal.lg class="mx-auto mt-5 grid max-w-[330px] grid-cols-7 gap-y-3 text-sm">
          <template x-for="d in encabezados" :key="d">
            <span class="pb-2 text-xs font-semibold uppercase tracking-[0.05em]" x-text="d"></span>
          </template>
          <template x-for="c in celdas" :key="c.id">
            <span class="relative flex h-8 items-center justify-center">
              <svg
                x-show="c.dia === diaEvento"
                class="absolute h-10 w-10 text-gold"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="0.9"
                aria-hidden="true"
              >
                <path d="M12 20.5s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7.5 2.5c0 5.4-7.5 10-7.5 10z" />
              </svg>
              <span class="relative" :class="c.dia === diaEvento && 'font-semibold text-gold'" x-text="c.dia"></span>
            </span>
          </template>
        </div>
      </section>


      <!-- Misa y recepción (ceremonias en event.config.js) -->
      <section class="relative w-full px-6 py-10 text-center">
        <!-- public/images/decoracion/lateral.webp — flores a los lados -->
        <img src="/images/decoracion/lateral.webp" alt="" aria-hidden="true" onerror="this.remove()" class="pointer-events-none absolute -left-4 top-0 w-24" />
        <img src="/images/decoracion/lateral.webp" alt="" aria-hidden="true" onerror="this.remove()" class="pointer-events-none absolute -right-4 top-1/3 w-24 -scale-x-100" />
        <template x-for="c in $store.event.ceremonias" :key="c.titulo">
          <div x-reveal.lg class="relative py-8">
            <span class="mx-auto block h-11 w-11 text-green" x-html="$icono(c.icono)"></span>
            <p class="mt-1 font-script text-4xl text-gold" x-text="c.titulo"></p>
            <p class="mt-3 text-lg font-bold uppercase tracking-[0.06em]" x-text="c.hora"></p>
            <p class="mt-1 text-[15px] font-semibold uppercase tracking-[0.04em]" x-text="c.lugar"></p>
            <p class="text-[13px] font-medium uppercase italic tracking-[0.02em]" x-text="c.direccion"></p>
            <a
              x-show="c.mapsUrl"
              :href="c.mapsUrl"
              target="_blank"
              rel="noopener"
              class="mt-4 inline-flex items-center gap-1.5 rounded-md bg-gold px-5 py-2 text-xs font-semibold uppercase tracking-[0.08em] text-paper shadow-sm transition-opacity hover:opacity-85"
            >
              <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" />
              </svg>
              Ver ubicación
            </a>
          </div>
        </template>
      </section>

      <!-- Foto destacada con bordes de papel rasgado: public/images/foto-1.webp (vertical) -->
      <section class="relative w-full py-6">
        <div
          x-reveal.lg
          class="relative aspect-[4/5] w-full bg-gradient-to-b from-[#f0dcd6] to-[#e6cdc5] [mask-image:url('/images/rasgado.svg')] [mask-size:100%_100%]"
        >
          <img
            :src="$store.event.fotoDestacada"
            alt=""
            loading="lazy"
            onerror="this.style.display='none'"
            class="h-full w-full object-cover"
          />
        </div>
        <!-- public/images/decoracion/ramo.webp — ramo sobre las esquinas -->
        <img src="/images/decoracion/ramo.webp" alt="" aria-hidden="true" onerror="this.remove()" class="pointer-events-none absolute -left-2 -top-4 w-1/2" />
        <img src="/images/decoracion/ramo.webp" alt="" aria-hidden="true" onerror="this.remove()" class="pointer-events-none absolute -bottom-6 -right-2 w-1/2 -scale-x-100" />
      </section>

      <!-- Itinerario: línea de tiempo con íconos que alternan de lado -->
      <template x-if="$store.event.itinerario?.length">
        <section class="relative w-full px-6 pt-10 pb-14 text-center">
          <div x-reveal class="text-gold">
            <p class="font-script text-4xl leading-none">Itinerario</p>
            <p class="my-1 text-xs font-semibold uppercase tracking-[0.2em] text-ink">de</p>
            <p class="font-script text-4xl leading-none">actividades</p>
          </div>
          <div class="relative mx-auto mt-10 max-w-[300px]">
            <div class="absolute bottom-3 left-1/2 top-3 w-0.5 -translate-x-1/2 bg-green"></div>
            <template x-for="(paso, i) in $store.event.itinerario" :key="paso.hora + paso.actividad">
              <div x-reveal class="relative grid grid-cols-[1fr_2.5rem_1fr] items-center py-4">
                <div class="flex justify-end pr-3" :class="i % 2 ? 'text-right' : ''">
                  <span x-show="i % 2 === 0" class="block h-9 w-9 text-green" x-html="$icono(paso.icono)"></span>
                  <div x-show="i % 2 === 1">
                    <p class="text-[13px] font-bold uppercase tracking-[0.06em]" x-text="paso.hora"></p>
                    <p class="text-[11px] font-semibold uppercase tracking-[0.12em]" x-text="paso.actividad"></p>
                  </div>
                </div>
                <span class="mx-auto h-2.5 w-2.5 rounded-full bg-green"></span>
                <div class="flex justify-start pl-3 text-left">
                  <span x-show="i % 2 === 1" class="block h-9 w-9 text-green" x-html="$icono(paso.icono)"></span>
                  <div x-show="i % 2 === 0">
                    <p class="text-[13px] font-bold uppercase tracking-[0.06em]" x-text="paso.hora"></p>
                    <p class="text-[11px] font-semibold uppercase tracking-[0.12em]" x-text="paso.actividad"></p>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </section>
      </template>

      <!-- Dress code -->
      <template x-if="$store.event.tieneDresscode">
        <section x-data="dresscode" class="w-full px-6 py-24">
          <div class="max-w-md mx-auto text-center">
            <p x-reveal class="uppercase tracking-[0.3em] text-xs text-ink/50 mb-4" x-text="eyebrow"></p>
            <p x-reveal.lg.blur.delay-150 class="font-serif italic text-5xl sm:text-6xl mb-12" x-text="titulo"></p>

            <button
              type="button"
              @click="show(0)"
              x-reveal.scale.delay-300
              :disabled="!photos.length"
              class="group relative mx-auto flex aspect-[3/4] w-full max-w-[260px] flex-col items-center justify-center gap-6 border border-ink/25 p-8 transition-colors hover:border-ink/60 cursor-pointer disabled:cursor-default"
            >
              <span class="absolute -top-px -left-px h-3 w-3 border-t border-l border-ink"></span>
              <span class="absolute -top-px -right-px h-3 w-3 border-t border-r border-ink"></span>
              <span class="absolute -bottom-px -left-px h-3 w-3 border-b border-l border-ink"></span>
              <span class="absolute -bottom-px -right-px h-3 w-3 border-b border-r border-ink"></span>

              <svg
                class="h-14 w-14 text-ink/60 transition-colors group-hover:text-ink"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 3a1.4 1.4 0 1 0-1.4 1.4" />
                <path d="M12 4.4V7" />
                <path d="M12 7l-8.4 5.6a1.8 1.8 0 0 0 1 3.3h14.8a1.8 1.8 0 0 0 1-3.3z" />
                <path d="M5 15.5h14" />
              </svg>
              <p class="max-w-[10rem] text-[11px] uppercase leading-relaxed tracking-[0.2em] text-ink/60" x-text="nota"></p>
              <span
                x-show="photos.length"
                class="absolute bottom-3 text-[10px] uppercase tracking-[0.2em] text-ink/40 opacity-0 transition-opacity group-hover:opacity-100"
              >
                Ver ejemplos
              </span>
            </button>

            <div x-reveal.delay-500 class="mt-10 flex items-center justify-center gap-4">
              <template x-for="color in paleta" :key="color">
                <span class="h-8 w-8 rounded-full border border-ink/20" :style="`background-color: ${color}`"></span>
              </template>
            </div>

            <button
              type="button"
              x-show="photos.length"
              @click="show(0)"
              x-reveal.delay-700
              class="mt-8 inline-block text-xs uppercase tracking-[0.2em] border border-ink/40 px-5 py-2.5 hover:bg-ink hover:text-paper transition-colors"
            >
              Ver ejemplos
            </button>
          </div>

          <!-- Visor a pantalla completa: ejemplos del dress code -->
          <div
            x-show="open"
            x-cloak
            @keydown.escape.window="close()"
            @keydown.arrow-right.window="next()"
            @keydown.arrow-left.window="prev()"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            class="fixed inset-0 z-50 flex items-center justify-center bg-ink/95 p-4"
            @click.self="close()"
          >
            <button
              type="button"
              @click="close()"
              class="absolute top-[max(1.25rem,env(safe-area-inset-top))] right-5 text-paper/70 hover:text-paper text-3xl leading-none"
              aria-label="Cerrar"
            >
              &times;
            </button>
            <button
              type="button"
              @click="prev()"
              class="absolute left-2 sm:left-6 text-paper/60 hover:text-paper text-4xl px-2"
              aria-label="Anterior"
            >
              &#8249;
            </button>
            <img
              :src="photos[index]"
              :alt="`Ejemplo de dress code ${index + 1}`"
              x-transition:enter="transition ease-out duration-300"
              x-transition:enter-start="opacity-0 scale-95"
              x-transition:enter-end="opacity-100 scale-100"
              :key="index"
              class="max-h-[85svh] max-w-full object-contain"
            />
            <button
              type="button"
              @click="next()"
              class="absolute right-2 sm:right-6 text-paper/60 hover:text-paper text-4xl px-2"
              aria-label="Siguiente"
            >
              &#8250;
            </button>
          </div>
        </section>
      </template>

      <!-- Galería -->
      <template x-if="$store.event.tieneGaleria">
        <section class="w-full px-6 py-20">
          <p x-reveal class="uppercase tracking-[0.25em] text-xs text-ink/50 text-center mb-3" x-text="$store.event.galeria.eyebrow"></p>
          <p x-reveal.delay-150 class="font-serif text-3xl sm:text-5xl text-center mb-12" x-text="$store.event.galeria.titulo"></p>

          <div x-data="gallery" class="max-w-3xl mx-auto grid grid-cols-2 sm:grid-cols-3 gap-2 sm:gap-3">
            <template x-for="(photo, i) in photos" :key="i">
              <button
                type="button"
                @click="show(i)"
                x-reveal
                :style="`transition-delay: ${(i % 6) * 60}ms`"
                class="group relative aspect-square overflow-hidden bg-ink/5"
              >
                <img
                  :src="photo"
                  :alt="`Foto ${i + 1}`"
                  loading="lazy"
                  decoding="async"
                  onerror="this.closest('button').style.display='none'"
                  class="h-full w-full object-cover transition duration-500 group-hover:scale-110"
                />
              </button>
            </template>

            <!-- Visor a pantalla completa -->
            <div
              x-show="open"
              x-cloak
              @keydown.escape.window="close()"
              @keydown.arrow-right.window="next()"
              @keydown.arrow-left.window="prev()"
              x-transition:enter="transition ease-out duration-300"
              x-transition:enter-start="opacity-0"
              x-transition:enter-end="opacity-100"
              x-transition:leave="transition ease-in duration-200"
              x-transition:leave-start="opacity-100"
              x-transition:leave-end="opacity-0"
              class="fixed inset-0 z-50 col-span-full flex items-center justify-center bg-ink/95 p-4"
              @click.self="close()"
            >
              <button
                type="button"
                @click="close()"
                class="absolute top-[max(1.25rem,env(safe-area-inset-top))] right-5 text-paper/70 hover:text-paper text-3xl leading-none"
                aria-label="Cerrar"
              >
                &times;
              </button>
              <button
                type="button"
                @click="prev()"
                class="absolute left-2 sm:left-6 text-paper/60 hover:text-paper text-4xl px-2"
                aria-label="Anterior"
              >
                &#8249;
              </button>
              <img
                :src="photos[index]"
                :alt="`Foto ${index + 1}`"
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 scale-95"
                x-transition:enter-end="opacity-100 scale-100"
                :key="index"
                class="max-h-[85svh] max-w-full object-contain"
              />
              <button
                type="button"
                @click="next()"
                class="absolute right-2 sm:right-6 text-paper/60 hover:text-paper text-4xl px-2"
                aria-label="Siguiente"
              >
                &#8250;
              </button>
            </div>
          </div>
        </section>
      </template>

      <!-- Fotos de invitados: enlace a /fotos/ (fotosInvitados.habilitado) -->
      <template x-if="$store.event.tieneFotosInvitados">
        <section class="w-full px-6 py-20 text-center">
          <p x-reveal class="uppercase tracking-[0.25em] text-xs text-ink/50 mb-3" x-text="$store.event.fotosInvitados.eyebrow"></p>
          <p x-reveal.delay-150 class="font-serif text-3xl sm:text-4xl mb-6" x-text="$store.event.fotosInvitados.titulo"></p>
          <p x-reveal.delay-300 class="text-sm text-ink/70 max-w-xs mx-auto mb-8" x-text="$store.event.fotosInvitados.nota"></p>
          <a
            x-reveal.delay-500
            :href="$store.event.fotosInvitados.url"
            class="inline-block text-xs uppercase tracking-[0.2em] border border-ink/40 px-5 py-2.5 hover:bg-ink hover:text-paper transition-colors"
            x-text="$store.event.fotosInvitados.boton"
          ></a>
        </section>
      </template>

      <!-- RSVP: por WhatsApp (rsvp.modo: 'whatsapp') o con pases (rsvp.modo: 'pases') -->
      <template x-if="$store.event.tieneRsvp">
        <section id="rsvp" class="w-full bg-charcoal text-paper px-6 py-24 border-t border-paper/15">
          <div class="max-w-sm mx-auto text-center">
            <p x-reveal class="font-serif text-3xl sm:text-4xl mb-2" x-text="$store.event.rsvp.titulo"></p>
            <div class="w-10 h-px bg-muted mx-auto my-6"></div>

            <!-- Opciones de WhatsApp: modo 'whatsapp', o respaldo sin enlace personal -->
            <template x-if="!$store.event.tieneRsvpPases">
              <div x-data="rsvp">
                <p x-reveal.delay-150 class="text-sm text-muted mb-10 max-w-xs mx-auto" x-text="nota"></p>
                <div class="grid grid-cols-2 gap-3 text-left">
                  <template x-for="(opcion, i) in opciones" :key="opcion">
                    <button
                      type="button"
                      @click="enviar(opcion)"
                      x-reveal.delay-300
                      :style="`transition-delay: ${i * 80}ms`"
                      class="border border-paper/30 px-4 py-3.5 text-xs leading-snug hover:bg-paper hover:text-charcoal transition-colors"
                      x-text="opcion"
                    ></button>
                  </template>
                </div>
              </div>
            </template>

            <!-- Pases: cada invitado confirma con su enlace (/?i=<código>) -->
            <template x-if="$store.event.tieneRsvpPases">
              <div x-data="rsvpPases" class="text-left">
                <p x-show="estado === 'cargando'" class="text-sm text-muted text-center">Cargando tu invitación…</p>

                <div x-show="estado === 'sin_enlace'" class="text-center">
                  <p class="text-sm text-muted max-w-xs mx-auto" x-text="error || $store.event.rsvp.sinEnlace"></p>
                  <template x-if="$store.event.rsvp.conWhatsapp">
                    <div x-data="rsvp" class="grid grid-cols-2 gap-3 text-left mt-8">
                      <template x-for="opcion in opciones" :key="opcion">
                        <button
                          type="button"
                          @click="enviar(opcion)"
                          class="border border-paper/30 px-4 py-3.5 text-xs leading-snug hover:bg-paper hover:text-charcoal transition-colors"
                          x-text="opcion"
                        ></button>
                      </template>
                    </div>
                  </template>
                </div>

                <div x-show="estado === 'error'" class="text-center">
                  <p class="text-sm text-muted mb-6" x-text="error"></p>
                  <button
                    type="button"
                    @click="cargar()"
                    class="text-xs uppercase tracking-[0.2em] border border-paper/40 px-5 py-2.5 hover:bg-paper hover:text-charcoal transition-colors"
                  >
                    Reintentar
                  </button>
                </div>

                <template x-if="estado === 'listo'">
                  <div>
                    <p class="font-serif text-2xl text-center" x-text="pase.nombre"></p>

                    <!-- Formulario -->
                    <form x-show="editando" @submit.prevent="enviar()" class="mt-6">
                      <p class="text-sm text-muted text-center mb-6" x-text="$store.event.rsvp.nota"></p>
                      <ul class="space-y-2">
                        <template x-for="persona in personas" :key="persona.id">
                          <li class="border border-paper/20 px-4 py-3">
                            <label class="flex items-center gap-3 cursor-pointer">
                              <input type="checkbox" x-model="persona.asiste" class="size-4 accent-paper" />
                              <span class="flex-1 text-sm" x-text="persona.libre ? 'Acompañante' : persona.nombre"></span>
                              <span x-show="persona.nino" class="text-[10px] uppercase tracking-[0.2em] text-muted">Niño/a</span>
                            </label>
                            <input
                              x-show="persona.libre && persona.asiste"
                              x-model="persona.nombre"
                              @input="error = ''"
                              type="text"
                              maxlength="80"
                              placeholder="Nombre de tu acompañante"
                              class="mt-3 w-full bg-transparent border-b border-paper/30 py-1.5 text-sm placeholder:text-muted focus:outline-none focus:border-paper"
                            />
                          </li>
                        </template>
                      </ul>

                      <textarea
                        x-model="mensaje"
                        rows="2"
                        maxlength="500"
                        placeholder="Mensaje para los festejados (opcional)"
                        class="mt-6 w-full bg-transparent border border-paper/20 px-4 py-3 text-sm placeholder:text-muted focus:outline-none focus:border-paper/60"
                      ></textarea>

                      <p x-show="error" class="mt-4 text-sm text-center text-red-300" x-text="error"></p>

                      <button
                        type="submit"
                        :disabled="enviando"
                        class="mt-6 w-full bg-paper text-charcoal py-3.5 text-xs uppercase tracking-[0.2em] disabled:opacity-60"
                        x-text="textoBoton"
                      ></button>
                      <button
                        x-show="personas.length > 1 && asistentes.length"
                        type="button"
                        @click="noAsistiremos()"
                        :disabled="enviando"
                        class="mt-3 w-full border border-paper/30 py-3 text-xs uppercase tracking-[0.2em] hover:bg-paper/10"
                      >
                        No podremos asistir
                      </button>
                      <button
                        x-show="respondio"
                        type="button"
                        @click="cancelar()"
                        class="mt-3 w-full py-2 text-xs text-muted underline underline-offset-4"
                      >
                        Cancelar
                      </button>
                      <p x-show="fechaLimite" class="mt-6 text-xs text-muted text-center">
                        Puedes confirmar o cambiar tu respuesta hasta el <span x-text="fechaLimite"></span>.
                      </p>
                    </form>

                    <!-- Respuesta guardada -->
                    <div x-show="!editando" class="mt-6 text-center">
                      <template x-if="respondio">
                        <div>
                          <p class="text-xs uppercase tracking-[0.25em] text-muted mb-3" x-text="$store.event.rsvp.gracias"></p>
                          <p class="text-sm" x-text="resumen"></p>
                          <p x-show="mensaje" class="mt-4 text-sm text-muted italic" x-text="`“${mensaje}”`"></p>
                        </div>
                      </template>
                      <p x-show="!respondio" class="text-sm text-muted">La fecha para confirmar ya pasó.</p>
                      <p x-show="error" class="mt-4 text-sm text-red-300" x-text="error"></p>
                      <template x-if="abierta">
                        <div>
                          <button
                            type="button"
                            @click="cambiar()"
                            class="mt-8 text-xs uppercase tracking-[0.2em] border border-paper/40 px-5 py-2.5 hover:bg-paper hover:text-charcoal transition-colors"
                          >
                            Cambiar respuesta
                          </button>
                          <p x-show="fechaLimite" class="mt-4 text-xs text-muted">
                            Hasta el <span x-text="fechaLimite"></span>.
                          </p>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </section>
      </template>

      <footer
        class="w-full px-6 py-10 text-center text-xs uppercase tracking-[0.2em] text-ink/40"
        x-text="$store.event.footer"
      ></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
