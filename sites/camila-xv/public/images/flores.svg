<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 500">
  <!--
    Ramo de flores de cerezo para la esquina superior izquierda del hero.
    En la esquina inferior derecha se usa el mismo archivo girado 180°.
    Provisional: se puede sustituir por una acuarela (PNG/WebP transparente).
  -->
  <defs>
    <radialGradient id="g-rosa" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="70">
      <stop offset="0" stop-color="#e2728c" />
      <stop offset="0.45" stop-color="#f2a7b6" />
      <stop offset="1" stop-color="#fde3e8" />
    </radialGradient>
    <radialGradient id="g-claro" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="70">
      <stop offset="0" stop-color="#f3a9b8" />
      <stop offset="0.5" stop-color="#fbd3db" />
      <stop offset="1" stop-color="#fff1f3" />
    </radialGradient>
    <radialGradient id="g-fuerte" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="70">
      <stop offset="0" stop-color="#c8405f" />
      <stop offset="0.6" stop-color="#e46a86" />
      <stop offset="1" stop-color="#f59aae" />
    </radialGradient>

    <!-- Pétalo con la muesca típica del cerezo, apuntando hacia arriba. -->
    <path id="petalo" d="M0 0 C -24 -16 -30 -50 -12 -66 Q -5 -60 0 -56 Q 5 -60 12 -66 C 30 -50 24 -16 0 0 Z" />

    <g id="estambres">
      <g stroke="#b9485f" stroke-width="1.2" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-20" />
        <line x1="0" y1="0" x2="14" y2="-14" />
        <line x1="0" y1="0" x2="19" y2="2" />
        <line x1="0" y1="0" x2="10" y2="16" />
        <line x1="0" y1="0" x2="-9" y2="17" />
        <line x1="0" y1="0" x2="-19" y2="3" />
        <line x1="0" y1="0" x2="-14" y2="-13" />
      </g>
      <g fill="#d9a35f">
        <circle cx="0" cy="-21" r="2.4" />
        <circle cx="15" cy="-15" r="2.4" />
        <circle cx="20" cy="2" r="2.4" />
        <circle cx="11" cy="17" r="2.4" />
        <circle cx="-10" cy="18" r="2.4" />
        <circle cx="-20" cy="3" r="2.4" />
        <circle cx="-15" cy="-14" r="2.4" />
      </g>
      <circle r="6" fill="#c2405c" />
    </g>

    <g id="flor-rosa" stroke="#e58aa0" stroke-width="1">
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-rosa)" />
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-rosa)" transform="rotate(72)" />
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-rosa)" transform="rotate(144)" />
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-rosa)" transform="rotate(216)" />
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-rosa)" transform="rotate(288)" />
      <use href="#estambres" xlink:href="#estambres" stroke="none" />
    </g>
    <g id="flor-claro" stroke="#f0aebb" stroke-width="1">
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-claro)" />
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-claro)" transform="rotate(72)" />
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-claro)" transform="rotate(144)" />
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-claro)" transform="rotate(216)" />
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-claro)" transform="rotate(288)" />
      <use href="#estambres" xlink:href="#estambres" stroke="none" transform="scale(0.8)" />
    </g>
    <g id="flor-fuerte" stroke="#c8405f" stroke-width="1">
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-fuerte)" />
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-fuerte)" transform="rotate(72)" />
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-fuerte)" transform="rotate(144)" />
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-fuerte)" transform="rotate(216)" />
      <use href="#petalo" xlink:href="#petalo" fill="url(#g-fuerte)" transform="rotate(288)" />
      <circle r="7" fill="#f6c27a" stroke="none" />
    </g>
    <g id="boton">
      <ellipse rx="9" ry="13" fill="#f2a1b2" stroke="#e07891" stroke-width="1" />
      <path d="M-6 8 Q 0 18 6 8" fill="#d9a35f" />
    </g>
  </defs>

  <!-- Flores claras al fondo -->
  <use href="#flor-claro" xlink:href="#flor-claro" transform="translate(205 175) rotate(20) scale(0.85)" />
  <use href="#flor-claro" xlink:href="#flor-claro" transform="translate(300 55) rotate(-10) scale(0.7)" />
  <use href="#flor-claro" xlink:href="#flor-claro" transform="translate(105 260) rotate(40) scale(0.75)" />
  <use href="#flor-claro" xlink:href="#flor-claro" transform="translate(385 110) rotate(5) scale(0.42)" />

  <!-- Flores principales -->
  <use href="#flor-rosa" xlink:href="#flor-rosa" transform="translate(95 70) rotate(15) scale(1.55)" />
  <use href="#flor-rosa" xlink:href="#flor-rosa" transform="translate(20 345) rotate(-20) scale(1.35)" />
  <use href="#flor-rosa" xlink:href="#flor-rosa" transform="translate(245 40) rotate(50) scale(0.95)" />

  <!-- Acentos en rosa intenso -->
  <use href="#flor-fuerte" xlink:href="#flor-fuerte" transform="translate(60 185) rotate(10) scale(0.45)" />
  <use href="#flor-fuerte" xlink:href="#flor-fuerte" transform="translate(165 140) rotate(-30) scale(0.3)" />

  <!-- Botones -->
  <use href="#boton" xlink:href="#boton" transform="translate(330 175) rotate(35)" />
  <use href="#boton" xlink:href="#boton" transform="translate(150 330) rotate(-20) scale(0.8)" />
  <use href="#boton" xlink:href="#boton" transform="translate(420 40) rotate(60) scale(0.7)" />

  <!-- Destellos dorados -->
  <g fill="#d9a35f">
    <circle cx="270" cy="230" r="4" />
    <circle cx="295" cy="205" r="2.5" />
    <circle cx="180" cy="300" r="3.5" />
    <circle cx="350" cy="80" r="3" />
    <circle cx="440" cy="85" r="2.5" />
    <circle cx="60" cy="430" r="3.5" />
    <circle cx="35" cy="455" r="2.5" />
    <circle cx="225" cy="260" r="2" />
    <circle cx="120" cy="395" r="2.5" />
    <circle cx="400" cy="150" r="2" />
  </g>
  <g fill="#ef8fa4">
    <circle cx="245" cy="290" r="3" />
    <circle cx="370" cy="190" r="2.5" />
    <circle cx="90" cy="420" r="2.5" />
  </g>
</svg>
