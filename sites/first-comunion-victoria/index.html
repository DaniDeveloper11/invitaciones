<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Sábado 10 de octubre de 2026, 12:00 hrs · Templo de la Cuevita Santa, Etzatlán, Jalisco. Acompáñame en este día de luz, fe y amor."
    />
    <meta name="theme-color" content="#fbf3ec" />

    <!--
      Vista previa al compartir (WhatsApp, Facebook, Telegram, iMessage…).
      La dirección sale de VITE_SITE_URL (archivo .env): debe ser absoluta,
      empezar con https:// y terminar en "/". Cámbiala ahí, no aquí.
    -->
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Primera Comunión de Victoria" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:title" content="Victoria Vélez Aviña · Mi Primera Comunión" />
    <meta
      property="og:description"
      content="Sábado 10 de octubre de 2026, 12:00 hrs · Templo de la Cuevita Santa, Etzatlán, Jalisco. Acompáñame en este día de luz, fe y amor."
    />
    <meta property="og:image" content="%VITE_SITE_URL%images/og.jpg" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%images/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Victoria Vélez Aviña — Mi Primera Comunión, 10 de octubre de 2026" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Victoria Vélez Aviña · Mi Primera Comunión" />
    <meta
      name="twitter:description"
      content="Sábado 10 de octubre de 2026, 12:00 hrs · Templo de la Cuevita Santa, Etzatlán, Jalisco."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%images/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <title>Victoria Vélez Aviña · Primera Comunión</title>
  </head>
  <body class="bg-paper text-ink font-sans antialiased">
    <!--
      Esta plantilla no contiene datos: todo sale de src/event.config.js y se lee
      con `$store.event`. Para cambiar textos, fotos o colores edita ese archivo.
      Para cambiar el diseño, edita este HTML libremente.
    -->
    <div id="app" x-data class="min-h-screen flex flex-col">
      <!-- Música de fondo (public/audio/song.mp3) -->
      <template x-if="$store.event.tieneMusica">
        <div x-data="audioPlayer" class="fixed bottom-5 right-5 z-40">
          <audio
            x-ref="audio"
            :src="src"
            loop
            preload="auto"
            @play="playing = true"
            @pause="playing = false"
          ></audio>
          <button
            type="button"
            @click="toggle()"
            class="flex h-12 w-12 items-center justify-center rounded-full border border-gold/30 bg-paper/90 text-gold shadow-sm backdrop-blur transition-colors hover:border-gold"
            :aria-label="playing ? 'Pausar música' : 'Reproducir música'"
          >
            <svg
              class="h-5 w-5"
              :class="{ 'animate-[spin_4s_linear_infinite]': playing }"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
            >
              <circle cx="12" cy="12" r="9" />
              <circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none" />
              <line x1="12" y1="3" x2="12" y2="5" />
            </svg>
          </button>
        </div>
      </template>

      <!-- Portada: ilustración + nombre en caligrafía -->
      <section
        x-data="{ show: false }"
        x-init="setTimeout(() => (show = true), 150)"
        class="relative h-[100svh] min-h-[100svh] w-full overflow-hidden bg-acuarela"
      >
        <div
          class="relative z-10 flex h-full flex-col items-center justify-center px-6 pb-[max(4rem,env(safe-area-inset-bottom))] pt-[max(2rem,env(safe-area-inset-top))] text-center text-ink"
          :style="`transform: translate3d(0, ${$store.scroll.y * 0.35}px, 0); opacity: ${Math.max(1 - $store.scroll.y / 500, 0)}`"
        >
          <p
            x-show="show"
            x-transition:enter="transition ease-out duration-1000"
            x-transition:enter-start="opacity-0 translate-y-4"
            x-transition:enter-end="opacity-100 translate-y-0"
            class="uppercase tracking-[0.35em] text-[10px] sm:text-xs text-muted mb-5"
            x-text="$store.event.hero.eyebrow"
          ></p>

          <!-- public/images/hero.webp — ilustración de la invitación -->
          <img
            :src="$store.event.hero.imagen"
            alt=""
            fetchpriority="high"
            decoding="async"
            onerror="this.style.display='none'"
            x-show="show"
            x-transition:enter="transition ease-out duration-1000 delay-150"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            class="w-[80%] max-w-[370px] object-contain drop-shadow-[0_8px_20px_rgba(107,79,58,0.08)]"
          />

          <h1
            x-show="show"
            x-transition:enter="transition ease-out duration-1000 delay-300"
            x-transition:enter-start="opacity-0 translate-y-6 blur-sm"
            x-transition:enter-end="opacity-100 translate-y-0 blur-none"
            class="font-script text-5xl sm:text-7xl leading-[1.15] text-gold mt-1"
            x-text="$store.event.hero.titulo"
          ></h1>
          <p
            x-show="show"
            x-transition:enter="transition ease-out duration-1000 delay-500"
            x-transition:enter-start="opacity-0 translate-y-4"
            x-transition:enter-end="opacity-100 translate-y-0"
            class="font-script text-4xl sm:text-5xl leading-tight text-gold/85"
            x-text="$store.event.hero.subtitulo"
          ></p>

          <img
            :src="$store.event.adorno"
            alt=""
            aria-hidden="true"
            onerror="this.style.display='none'"
            x-show="show"
            x-transition:enter="transition ease-out duration-1000 delay-700"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            class="mt-4 w-48 sm:w-60"
          />
        </div>

        <div
          x-show="show"
          x-transition:enter="transition ease-out duration-1000 delay-1000"
          x-transition:enter-start="opacity-0"
          x-transition:enter-end="opacity-70"
          :style="`opacity: ${Math.max(0.7 - $store.scroll.y / 150, 0)}`"
          class="absolute bottom-6 left-1/2 z-10 -translate-x-1/2 text-gold"
        >
          <svg class="h-5 w-5 animate-bounce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 4v16m0 0l-6-6m6 6l6-6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </section>

      <!-- Mensaje personal -->
      <template x-if="$store.event.mensaje.texto">
        <section class="w-full bg-paper px-6 py-20 flex flex-col items-center text-center">
          <p x-reveal class="uppercase tracking-[0.3em] text-[11px] text-muted mb-8" x-text="$store.event.mensaje.eyebrow"></p>
          <p
            x-reveal.lg.blur.delay-150
            class="font-serif italic text-lg sm:text-2xl leading-relaxed w-full max-w-xl text-ink/85 whitespace-pre-line text-balance"
            x-text="$store.event.mensaje.texto"
          ></p>
          <img
            x-reveal.delay-300
            :src="$store.event.adorno"
            alt=""
            aria-hidden="true"
            onerror="this.style.display='none'"
            class="mt-10 w-44"
          />
        </section>
      </template>

      <!-- Fecha y hora -->
      <section class="w-full bg-acuarela px-6 py-20 flex flex-col items-center text-center">
        <p x-reveal class="uppercase tracking-[0.3em] text-[11px] text-muted mb-6" x-text="$store.event.guardaLaFecha"></p>
        <div
          x-reveal.lg.blur.delay-150
          class="flex w-full max-w-md items-stretch justify-center divide-x divide-gold/30 text-gold"
        >
          <div class="flex flex-1 items-center justify-center px-3">
            <p class="font-serif text-2xl sm:text-3xl" x-text="$store.event.fechaPartes.dia"></p>
          </div>
          <div class="flex flex-1 flex-col items-center justify-center px-3">
            <p class="font-serif text-5xl sm:text-6xl leading-none" x-text="$store.event.fechaPartes.numero"></p>
            <p class="font-serif text-xl sm:text-2xl leading-tight" x-text="$store.event.fechaPartes.mes"></p>
          </div>
          <div class="flex flex-1 items-center justify-center px-3">
            <p class="font-serif text-2xl sm:text-3xl" x-text="$store.event.fechaPartes.anio"></p>
          </div>
        </div>
        <p x-reveal.delay-300 class="mt-8 uppercase tracking-[0.25em] text-sm text-ink/70" x-text="$store.event.horaTexto"></p>
      </section>

      <!-- Cuenta regresiva -->
      <section x-data="countdown" class="w-full bg-charcoal text-ink px-6 py-20">
        <p
          x-reveal
          class="uppercase tracking-[0.3em] text-[11px] text-muted text-center mb-10"
          x-text="$store.event.cuentaRegresiva.eyebrow"
        ></p>

        <div x-show="!terminado" x-reveal.lg.scale class="flex gap-6 sm:gap-10 justify-center text-center">
          <div>
            <span class="block text-4xl sm:text-6xl font-serif tabular-nums text-gold" x-text="pad(dias)"></span>
            <span class="block mt-2 text-[10px] sm:text-xs uppercase tracking-[0.25em] text-muted">Días</span>
          </div>
          <div>
            <span class="block text-4xl sm:text-6xl font-serif tabular-nums text-gold" x-text="pad(horas)"></span>
            <span class="block mt-2 text-[10px] sm:text-xs uppercase tracking-[0.25em] text-muted">Horas</span>
          </div>
          <div>
            <span class="block text-4xl sm:text-6xl font-serif tabular-nums text-gold" x-text="pad(minutos)"></span>
            <span class="block mt-2 text-[10px] sm:text-xs uppercase tracking-[0.25em] text-muted">Min</span>
          </div>
          <div>
            <span class="block text-4xl sm:text-6xl font-serif tabular-nums text-gold" x-text="pad(segundos)"></span>
            <span class="block mt-2 text-[10px] sm:text-xs uppercase tracking-[0.25em] text-muted">Seg</span>
          </div>
        </div>

        <p
          x-show="terminado"
          x-cloak
          class="font-serif text-3xl sm:text-4xl text-center text-gold"
          x-text="$store.event.cuentaRegresiva.finalizado"
        ></p>
      </section>

      <!-- Detalles: ceremonia y recepción -->
      <section class="w-full bg-paper px-6 py-20">
        <p
          x-reveal
          class="uppercase tracking-[0.3em] text-[11px] text-muted text-center mb-12"
          x-text="$store.event.lugar.eyebrow"
        ></p>

        <div class="max-w-md mx-auto divide-y divide-line">
          <!-- Ceremonia -->
          <div x-data="{ sede: $store.event.lugar }" x-reveal.lg class="py-8 text-center">
            <p class="mb-3 text-rose text-lg leading-none" aria-hidden="true">♡</p>
            <p class="uppercase tracking-[0.22em] text-[11px] text-muted mb-2" x-text="sede.etiqueta"></p>
            <p class="font-serif text-2xl sm:text-3xl mb-1 text-gold" x-text="sede.nombre"></p>
            <p class="text-sm text-ink/70 mb-5" x-text="sede.direccion"></p>
            <a
              x-show="sede.mapsUrl"
              :href="sede.mapsUrl"
              target="_blank"
              rel="noopener"
              class="inline-block text-[11px] uppercase tracking-[0.2em] border border-gold/40 text-gold px-4 py-2 hover:bg-gold hover:text-paper transition-colors"
            >
              Ver en el mapa
            </a>
          </div>

          <!-- Recepción -->
          <div x-data="{ sede: $store.event.recepcion }" x-reveal.lg.delay-150 class="py-8 text-center">
            <p class="mb-3 text-rose text-lg leading-none" aria-hidden="true">♡</p>
            <p class="uppercase tracking-[0.22em] text-[11px] text-muted mb-2" x-text="sede.etiqueta"></p>
            <p class="font-serif text-2xl sm:text-3xl mb-1 text-gold" x-text="sede.nombre"></p>
            <p class="text-sm text-ink/70 mb-5" x-text="sede.direccion"></p>
            <a
              x-show="sede.mapsUrl"
              :href="sede.mapsUrl"
              target="_blank"
              rel="noopener"
              class="inline-block text-[11px] uppercase tracking-[0.2em] border border-gold/40 text-gold px-4 py-2 hover:bg-gold hover:text-paper transition-colors"
            >
              Ver en el mapa
            </a>
          </div>
        </div>
      </section>

      <!-- Dress code -->
      <template x-if="$store.event.tieneDresscode">
        <section x-data="dresscode" class="w-full bg-acuarela px-6 py-24">
          <div class="max-w-md mx-auto text-center">
            <p x-reveal class="uppercase tracking-[0.3em] text-[11px] text-muted mb-4" x-text="eyebrow"></p>
            <p x-reveal.lg.blur.delay-150 class="font-serif italic text-5xl sm:text-6xl mb-12 text-gold" x-text="titulo"></p>

            <button
              type="button"
              @click="show(0)"
              x-reveal.scale.delay-300
              :disabled="!photos.length"
              class="group relative mx-auto flex aspect-[3/4] w-full max-w-[260px] flex-col items-center justify-center gap-6 border border-gold/30 p-8 transition-colors hover:border-gold/70 cursor-pointer disabled:cursor-default"
            >
              <span class="absolute -top-px -left-px h-3 w-3 border-t border-l border-gold"></span>
              <span class="absolute -top-px -right-px h-3 w-3 border-t border-r border-gold"></span>
              <span class="absolute -bottom-px -left-px h-3 w-3 border-b border-l border-gold"></span>
              <span class="absolute -bottom-px -right-px h-3 w-3 border-b border-r border-gold"></span>

              <svg
                class="h-14 w-14 text-gold/60 transition-colors group-hover:text-gold"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 3a1.4 1.4 0 1 0-1.4 1.4" />
                <path d="M12 4.4V7" />
                <path d="M12 7l-8.4 5.6a1.8 1.8 0 0 0 1 3.3h14.8a1.8 1.8 0 0 0 1-3.3z" />
                <path d="M5 15.5h14" />
              </svg>
              <p class="max-w-[10rem] text-[11px] uppercase leading-relaxed tracking-[0.2em] text-ink/60" x-text="nota"></p>
              <span
                x-show="photos.length"
                class="absolute bottom-3 text-[10px] uppercase tracking-[0.2em] text-ink/40 opacity-0 transition-opacity group-hover:opacity-100"
              >
                Ver ejemplos
              </span>
            </button>

            <div x-reveal.delay-500 class="mt-10 flex items-center justify-center gap-4">
              <template x-for="color in paleta" :key="color">
                <span class="h-8 w-8 rounded-full border border-gold/25" :style="`background-color: ${color}`"></span>
              </template>
            </div>

            <button
              type="button"
              x-show="photos.length"
              @click="show(0)"
              x-reveal.delay-700
              class="mt-8 inline-block text-[11px] uppercase tracking-[0.2em] border border-gold/40 text-gold px-5 py-2.5 hover:bg-gold hover:text-paper transition-colors"
            >
              Ver ejemplos
            </button>
          </div>

          <!-- Visor a pantalla completa: ejemplos del dress code -->
          <div
            x-show="open"
            x-cloak
            @keydown.escape.window="close()"
            @keydown.arrow-right.window="next()"
            @keydown.arrow-left.window="prev()"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            class="fixed inset-0 z-50 flex items-center justify-center bg-ink/95 p-4"
            @click.self="close()"
          >
            <button
              type="button"
              @click="close()"
              class="absolute top-[max(1.25rem,env(safe-area-inset-top))] right-5 text-paper/70 hover:text-paper text-3xl leading-none"
              aria-label="Cerrar"
            >
              &times;
            </button>
            <button
              type="button"
              @click="prev()"
              class="absolute left-2 sm:left-6 text-paper/60 hover:text-paper text-4xl px-2"
              aria-label="Anterior"
            >
              &#8249;
            </button>
            <img
              :src="photos[index]"
              :alt="`Ejemplo de dress code ${index + 1}`"
              x-transition:enter="transition ease-out duration-300"
              x-transition:enter-start="opacity-0 scale-95"
              x-transition:enter-end="opacity-100 scale-100"
              :key="index"
              class="max-h-[85svh] max-w-full object-contain"
            />
            <button
              type="button"
              @click="next()"
              class="absolute right-2 sm:right-6 text-paper/60 hover:text-paper text-4xl px-2"
              aria-label="Siguiente"
            >
              &#8250;
            </button>
          </div>
        </section>
      </template>

      <!-- Galería -->
      <template x-if="$store.event.tieneGaleria">
        <section class="w-full bg-paper px-6 py-20">
          <p x-reveal class="uppercase tracking-[0.3em] text-[11px] text-muted text-center mb-3" x-text="$store.event.galeria.eyebrow"></p>
          <p x-reveal.delay-150 class="font-serif text-3xl sm:text-5xl text-center mb-12 text-gold" x-text="$store.event.galeria.titulo"></p>

          <div x-data="gallery" class="max-w-3xl mx-auto grid grid-cols-2 sm:grid-cols-3 gap-2 sm:gap-3">
            <template x-for="(photo, i) in photos" :key="i">
              <button
                type="button"
                @click="show(i)"
                x-reveal
                :style="`transition-delay: ${(i % 6) * 60}ms`"
                class="group relative aspect-square overflow-hidden bg-ink/5"
              >
                <img
                  :src="photo"
                  :alt="`Foto ${i + 1}`"
                  loading="lazy"
                  decoding="async"
                  onerror="this.closest('button').style.display='none'"
                  class="h-full w-full object-cover transition duration-500 group-hover:scale-110"
                />
              </button>
            </template>

            <!-- Visor a pantalla completa -->
            <div
              x-show="open"
              x-cloak
              @keydown.escape.window="close()"
              @keydown.arrow-right.window="next()"
              @keydown.arrow-left.window="prev()"
              x-transition:enter="transition ease-out duration-300"
              x-transition:enter-start="opacity-0"
              x-transition:enter-end="opacity-100"
              x-transition:leave="transition ease-in duration-200"
              x-transition:leave-start="opacity-100"
              x-transition:leave-end="opacity-0"
              class="fixed inset-0 z-50 col-span-full flex items-center justify-center bg-ink/95 p-4"
              @click.self="close()"
            >
              <button
                type="button"
                @click="close()"
                class="absolute top-[max(1.25rem,env(safe-area-inset-top))] right-5 text-paper/70 hover:text-paper text-3xl leading-none"
                aria-label="Cerrar"
              >
                &times;
              </button>
              <button
                type="button"
                @click="prev()"
                class="absolute left-2 sm:left-6 text-paper/60 hover:text-paper text-4xl px-2"
                aria-label="Anterior"
              >
                &#8249;
              </button>
              <img
                :src="photos[index]"
                :alt="`Foto ${index + 1}`"
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 scale-95"
                x-transition:enter-end="opacity-100 scale-100"
                :key="index"
                class="max-h-[85svh] max-w-full object-contain"
              />
              <button
                type="button"
                @click="next()"
                class="absolute right-2 sm:right-6 text-paper/60 hover:text-paper text-4xl px-2"
                aria-label="Siguiente"
              >
                &#8250;
              </button>
            </div>
          </div>
        </section>
      </template>

      <!-- RSVP por WhatsApp -->
      <template x-if="$store.event.tieneRsvp">
        <section class="w-full bg-charcoal text-ink px-6 py-24 border-t border-line">
          <div x-data="rsvp" class="max-w-sm mx-auto text-center">
            <p x-reveal class="font-serif text-2xl sm:text-4xl text-gold mb-2" x-text="titulo"></p>
            <div class="w-10 h-px bg-gold/40 mx-auto my-6"></div>
            <p x-reveal.delay-150 class="text-sm text-ink/70 mb-10 max-w-xs mx-auto" x-text="nota"></p>

            <div class="grid grid-cols-2 gap-3 text-left">
              <template x-for="(opcion, i) in opciones" :key="opcion">
                <button
                  type="button"
                  @click="enviar(opcion)"
                  x-reveal.delay-300
                  :style="`transition-delay: ${i * 80}ms`"
                  class="border border-gold/35 px-4 py-3.5 text-xs leading-snug hover:bg-gold hover:text-paper transition-colors"
                  x-text="opcion"
                ></button>
              </template>
            </div>

            <a
              x-reveal.delay-500
              :href="`tel:+${$store.event.rsvp.whatsapp}`"
              class="mt-8 inline-flex items-center gap-2 text-sm tracking-[0.15em] text-gold hover:text-ink transition-colors"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path
                  d="M4 5.5A1.5 1.5 0 0 1 5.5 4h2a1.5 1.5 0 0 1 1.45 1.1l.6 2.2a1.5 1.5 0 0 1-.42 1.5l-1.1 1a12 12 0 0 0 5.17 5.17l1-1.1a1.5 1.5 0 0 1 1.5-.42l2.2.6A1.5 1.5 0 0 1 20 16.5v2a1.5 1.5 0 0 1-1.5 1.5A15.5 15.5 0 0 1 4 5.5z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              33 1344 9813
            </a>
          </div>
        </section>
      </template>

      <footer
        class="w-full bg-paper px-6 py-10 text-center text-xs uppercase tracking-[0.25em] text-muted"
        x-text="$store.event.footer"
      ></footer>
    </div>
