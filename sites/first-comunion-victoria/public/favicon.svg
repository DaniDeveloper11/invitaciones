<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cruz con flor">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6f0" />
      <stop offset="1" stop-color="#f3ded6" />
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0a05c" />
      <stop offset="1" stop-color="#a86f30" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#fondo)" />
  <circle cx="32" cy="32" r="30" fill="none" stroke="#c9a063" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Cruz -->
  <g fill="url(#oro)">
    <rect x="28" y="10" width="8" height="44" rx="2.5" />
    <rect x="15" y="25" width="34" height="8" rx="2.5" />
  </g>

  <!-- Flor de cerezo en el cruce -->
  <g fill="#e9b8b4">
    <circle cx="32.0" cy="24.4" r="3.4" />
    <circle cx="36.4" cy="27.6" r="3.4" />
    <circle cx="34.7" cy="32.7" r="3.4" />
    <circle cx="29.3" cy="32.7" r="3.4" />
    <circle cx="27.6" cy="27.6" r="3.4" />
  </g>
  <circle cx="32" cy="29" r="2.2" fill="#c97f7d" />
</svg>
